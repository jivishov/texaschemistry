<style>
/* ===== shared tokens and components (look: design-drafts/labbench-style-draft.html, 2026-10-26) ===== */
:root{--bg:#eef2ef;--paper:#fcfdfc;--paper2:#f4f7f5;--ink:#1b302e;--muted:#4f605b;--line:#dbe3de;--sunk:#edf3e4;
  --accent:#0b5951;--accent-ink:#ffffff;--accent-soft:#e6f1ea;--warm:#835811;--warm-soft:#f8eed9;--label:#0b5951;--ok:#1f6e4f;--ok-soft:#e1f0e6;--bad:#a8402f;--bad-soft:#f9e6e1;
  --pos:#c0391b;--neg:#2b55b8;--neu:#6b7176;--gold:#9c7400;--star:#dd9c26;
  --body:'Charis SIL',Charter,Georgia,serif;--display:'DM Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --shadow:0 1px 2px rgba(18,61,45,.05),0 8px 26px rgba(18,61,45,.07);color-scheme:light;--surface:#ffffff;--pick:#dbecc3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1715;--paper:#152120;--paper2:#182523;--ink:#e3ece8;--muted:#a6b6b0;--line:#283632;--sunk:#22301f;
  --accent:#73c7b4;--accent-ink:#06231f;--accent-soft:#163029;--warm:#e6bd6c;--warm-soft:#33290f;--label:#9fd7a8;--ok:#7fd1a6;--ok-soft:#163026;--bad:#f39886;--bad-soft:#3a1e19;
  --pos:#ff9a6c;--neg:#8eb1ff;--neu:#9ba49f;--gold:#e6c65c;--star:#f0bd55;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 26px rgba(0,0,0,.4);color-scheme:dark;--surface:#1c2a27;--pick:#2b4a20}}
:root[data-theme="dark"]{--bg:#0f1715;--paper:#152120;--paper2:#182523;--ink:#e3ece8;--muted:#a6b6b0;--line:#283632;--sunk:#22301f;
  --accent:#73c7b4;--accent-ink:#06231f;--accent-soft:#163029;--warm:#e6bd6c;--warm-soft:#33290f;--label:#9fd7a8;--ok:#7fd1a6;--ok-soft:#163026;--bad:#f39886;--bad-soft:#3a1e19;
  --pos:#ff9a6c;--neg:#8eb1ff;--neu:#9ba49f;--gold:#e6c65c;--star:#f0bd55;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 26px rgba(0,0,0,.4);color-scheme:dark;--surface:#1c2a27;--pick:#2b4a20}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.55}
sup,sub{font-size:.68em;line-height:0}
button{font:inherit;color:inherit}
.nw{white-space:nowrap}
.mono{font-family:var(--mono)}
/* header logo (kit/src/shared/logo.svg, drawn by brand/make.js): the double bonds swap to benzene's other resonance structure on hover */
.logo .ring,.logo .kb{fill:none;stroke:var(--accent);stroke-linecap:round;stroke-linejoin:round}
.logo .star{fill:var(--star);stroke:var(--star);stroke-linejoin:round}
.logo .kb{transition:opacity .35s}
.logo .kb2,.brand:hover .logo .kb1,.brand:focus-visible .logo .kb1{opacity:0}
.brand:hover .logo .kb2,.brand:focus-visible .logo .kb2{opacity:1}
@media (prefers-reduced-motion:reduce){.logo .kb{transition:none}}
.muted{color:var(--muted)}
.label{font-family:var(--mono);font-size:.7em;letter-spacing:.08em;text-transform:uppercase;color:var(--label);font-weight:500;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;min-height:2.3em;padding:.3em .85em;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font-weight:700;cursor:pointer;white-space:nowrap;position:relative;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,.term:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn[aria-pressed="true"]{background:var(--pick);color:var(--ink);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.correct{background:var(--ok-soft);border-color:var(--ok)}
.btn.wrong{background:var(--bad-soft);border-color:var(--bad)}
.btn.correct::after,.btn.wrong::after{position:absolute;top:-.5em;right:-.45em;width:1.3em;height:1.3em;border-radius:50%;display:grid;place-items:center;font-size:.72em;line-height:1;color:var(--paper);box-shadow:0 0 0 2px var(--paper)}
.btn.correct::after{content:"✓";background:var(--ok)}
.btn.wrong::after{content:"✗";background:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:.4em}
.chips span{background:var(--sunk);border-radius:99px;padding:.15em .65em;font-size:.88em}
select{font:inherit;background:var(--paper);color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:.25em .5em;min-height:2.1em;max-width:100%}
input[type=number],input[type=text]{font:inherit;background:var(--paper);color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:.25em .5em;min-height:2.1em}
input[type=range]{accent-color:var(--accent);width:100%}
.bar .tools .btn,.bar .seg button,.btn.primary{font-family:var(--display)}

/* ===== Unit 2 component kit: sims, checks, glossary (shared by every surface) ===== */
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:transparent;padding:.35em .8em;font-weight:700;cursor:pointer;min-height:2.2em;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--pick);color:var(--ink);border-color:var(--accent)}
/* glossary terms */
.term{border:0;background:none;padding:0;color:inherit;font:inherit;font-weight:700;cursor:help;border-bottom:2px dotted color-mix(in srgb,var(--accent) 70%,transparent);line-height:1.2}
.gpop{position:fixed;z-index:60;max-width:min(340px,calc(100vw - 24px));background:var(--paper);border:1.5px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:.7em .9em;font-size:15px;line-height:1.4}
.gpop b{font-family:var(--display);font-size:1.08em}
.gpop .es{display:block;margin-top:.35em;font-size:.88em;color:var(--muted)}
.gpop .es i{color:var(--ink);font-style:normal;font-weight:700}

/* checks */
.check{border:1.5px solid var(--line);border-radius:14px;background:var(--paper);padding:.8em 1em;display:flex;flex-direction:column;gap:.55em}
.check .q{font-weight:700;margin:0}
.check .opts{display:flex;flex-direction:column;gap:.4em}
.check .opts .btn{display:block;justify-content:flex-start;text-align:left;white-space:normal;line-height:1.3;padding:.45em .8em;font-weight:600}
.check .fb{margin:0;font-size:.94em;border-radius:10px;padding:.5em .7em;display:none}
.check .fb.ok{display:block;background:var(--ok-soft);border-left:4px solid var(--ok)}
.check .fb.no{display:block;background:var(--bad-soft);border-left:4px solid var(--bad)}
.check .meta{display:flex;justify-content:space-between;gap:.5em;font-family:var(--display);font-size:.68em;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* sim shells */
.sim{display:flex;flex-direction:column;gap:.55em}
.sim .cv{position:relative;width:100%;border-radius:12px;overflow:hidden;background:var(--paper2);border:1.5px solid var(--line)}
.sim canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.sim .ctl{display:flex;flex-wrap:wrap;gap:.45em;align-items:center}
.sim .ctl .grp{display:flex;align-items:center;gap:.4em;flex-wrap:wrap}
.sim .ctl .lab{font-family:var(--display);font-size:.68em;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);font-weight:700}
.ros{display:flex;flex-wrap:wrap;gap:.45em}
.ro{background:var(--sunk);border-radius:10px;padding:.3em .6em;min-width:5.5em}
.ro small{display:block;font-family:var(--display);font-size:.62em;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);white-space:nowrap;font-weight:700}
.ro span{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}
.simnote{font-size:.82em;color:var(--muted);margin:0}
.say{font-size:.95em;margin:0;border-radius:10px;padding:.5em .7em;background:var(--accent-soft)}
.say.ok{background:var(--ok-soft)}.say.no{background:var(--bad-soft)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* mass table */
.tscroll{overflow-x:auto}
table.masst{width:100%;border-collapse:collapse;font-size:.86em}
table.masst th{font-family:var(--display);font-size:.72em;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);text-align:left;padding:.4em .45em;border-bottom:2px solid var(--line);vertical-align:bottom;font-weight:700}
table.masst td{padding:.45em .45em;border-bottom:1px solid var(--line);vertical-align:middle}
table.masst td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
table.masst tr.pe td{background:color-mix(in srgb,var(--warm-soft) 70%,transparent)}
table.masst .calc{display:block;font-family:var(--mono);font-size:.78em;color:var(--muted)}
/* model builder */
.mbhead{margin:0;font-size:1em}
.mbgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:.8em;align-items:center}
.mbopts{display:flex;flex-direction:column;gap:.55em}
.mbrow{display:flex;flex-direction:column;gap:.25em}
.mbrow .lab{font-family:var(--display);font-size:.68em;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);font-weight:700}
.mbchoices{display:flex;flex-wrap:wrap;gap:.35em}
.mbchoices .btn{font-size:.82em;min-height:2.1em;padding:.25em .65em;white-space:normal;text-align:left;font-weight:600}
.mbprev svg{width:100%;max-width:220px;display:block;margin:0 auto}
.mbuild>.btn.primary{align-self:flex-start}
@media (max-width:600px){.mbgrid{grid-template-columns:minmax(0,1fr)}}
/* timeline */
ol.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.45em;counter-reset:tl}
.tlc{display:grid;grid-template-columns:auto 52px minmax(0,1fr) minmax(0,1.6fr) auto;gap:.5em;align-items:center;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:.35em .5em;counter-increment:tl}
.tlc .grip{cursor:grab;color:var(--muted);font-weight:800;letter-spacing:-.15em;padding:0 .2em;touch-action:none;user-select:none}
.tlc .thumb svg{width:52px;height:52px;display:block}
.tlc .tn{font-size:.92em;line-height:1.2}
.tlc .tn::before{content:counter(tl)". ";font-family:var(--mono);color:var(--muted);font-size:.85em}
.tlc select{font-size:.82em;width:100%}
.tlc .ud{display:flex;flex-direction:column;gap:2px}
.tlc .ud .btn{min-height:1.5em;padding:0 .45em;font-size:.7em}
.tlc.dragging{box-shadow:var(--shadow);border-color:var(--accent);opacity:.92}
.tlc{position:relative}
.tlc.ok{border-color:var(--ok);background:var(--ok-soft)}
.tlc.ok::after,.tlc.no::after{position:absolute;top:-7px;right:-7px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--paper);box-shadow:0 0 0 2px var(--paper)}
.tlc.ok::after{content:"✓";background:var(--ok)}
.tlc.no::after{content:"✗";background:var(--bad)}
.tlc.no{border-color:var(--bad);background:var(--bad-soft)}
@media (max-width:600px){.tlc{grid-template-columns:auto 40px minmax(0,1fr) auto}.tlc .thumb svg{width:40px;height:40px}.tlc select{grid-column:2/4}}

.sim .seg button{font-size:.82em;padding:.25em .65em;min-height:2.1em}
.sim .ctl .btn{font-size:.85em;min-height:2.1em;padding:.25em .7em}
.checkset{display:flex;flex-direction:column;gap:.5em;margin:0 0 1em}
.checkset .tabs{display:flex;gap:.35em;flex-wrap:wrap}
.checkset .tabs .btn{font-size:.78em;min-height:1.9em;padding:.15em .7em}
.checkset .tabs .btn.done::before{content:"✓ ";color:var(--ok)}
.checkset>.check{margin:0!important}
table.masst .btn.sm{font-size:.85em}
/* an element symbol or formula inside a capitalised label keeps its own case: "Na", not "NA" */
.chem{text-transform:none!important}

body{font-size:17px}
/* the page's top bar only: a lesson's model may have a control row named .bar of its own */
header.bar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:6px 18px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);font-size:15px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:30px;height:30px;flex:none;display:block}
.brand b{display:block;font-family:var(--display);font-size:16px;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:12.5px}
.mtabs{display:flex;gap:4px;flex-wrap:wrap}
.mtabs button{border:0;background:none;padding:8px 12px;border-radius:10px;font-weight:700;cursor:pointer;color:var(--muted);display:flex;gap:6px;align-items:center;font-size:14.5px}
.mtabs button[aria-current="true"]{background:var(--pick);color:var(--ink);border-color:var(--accent)}
.mtabs button .c{font-family:var(--mono);font-size:11.5px;font-weight:600;opacity:.85}
.mtabs button:disabled{opacity:.55;cursor:not-allowed}
.mwrap{max-width:1240px;margin:0 auto;padding:22px 20px 60px}
.mhead{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:16px}
.mhead h1{font-family:var(--display);font-size:36px;line-height:1.05;margin:.1em 0 .2em}
.mintro{margin:0;color:var(--muted)}
.mhead>div:first-child{flex:1 1 18em;min-width:0}
.mprog{text-align:right}
.dots{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.dots button{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:var(--paper);font-family:var(--mono);font-size:12px;font-weight:600;cursor:pointer;color:var(--muted)}
.dots button.cur{background:var(--pick);border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent);color:var(--ink)}
.dots button.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.dots button.part{background:var(--warm-soft);border-color:var(--warm)}
#mscore{margin:.4em 0 0;font-size:13px;color:var(--muted)}
.case{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:0;background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.case .ev{padding:24px 26px;background:var(--paper2);border-right:1px solid var(--line)}
.case .tasks{padding:24px 26px;display:flex;flex-direction:column;gap:14px}
/* the place label wraps like text: a long one breaks between words, not into a second column for "· Objective" */
.ctx{display:inline-block;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--label);font-weight:500}
.ctx .oid{color:var(--muted);margin-left:.3em}
.case h2{font-family:var(--display);font-size:28px;line-height:1.1;margin:.25em 0 .6em}
.case .evb p{margin:0 0 .7em}
table.dt{border-collapse:collapse;width:100%;font-size:.92em;margin:.3em 0 .8em;background:var(--paper);border-radius:10px;overflow:hidden}
table.dt th{font-family:var(--display);font-size:11.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);text-align:left;padding:.45em .6em;border-bottom:2px solid var(--line);font-weight:700}
table.dt td{padding:.45em .6em;border-bottom:1px solid var(--line)}
.lines svg{width:100%;height:auto;display:block;border-radius:8px}
.task{border:1.5px solid var(--line);border-radius:14px;padding:.75em .95em;display:flex;flex-direction:column;gap:.5em}
.task .tl{display:flex;justify-content:space-between;gap:10px;font-family:var(--display);font-size:11.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);font-weight:700}
.task .tl b{color:var(--warm)}
.task.ok{border-color:var(--ok)}
.task .q{margin:0;font-weight:700}
.numrow{display:flex;gap:.5em;align-items:center;flex-wrap:wrap}
.numrow input{width:8em}
.numrow .u{color:var(--muted)}
/* an answer-button row is laid out by missions.js (rows()): balanced rows, as many across as fit at --mbmin each and at most
   --mbmax, fewer when a word would be cut. A lesson tunes a row with these two, never with grid-template-columns, which the
   script sets. The grid here only shows until the script runs. */
@property --mbmin{syntax:'<length>';inherits:true;initial-value:0px}
@property --mbmax{syntax:'<integer>';inherits:true;initial-value:99}
.mbtns{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.4em;--mbmin:8em}
.mbtns .btn{flex-direction:column;padding:.4em .3em;gap:.15em;font-size:.86em;white-space:normal;line-height:1.1}
.mbtns .btn svg{width:42px;height:42px}
.fbx{margin:0;font-size:.94em;border-radius:10px;padding:.5em .7em}
.fbx.ok{background:var(--ok-soft);border-left:4px solid var(--ok)}
.fbx.no{background:var(--bad-soft);border-left:4px solid var(--bad)}
.task .check{border:0;padding:0;background:none}
.task .check .meta{display:none}
.cnav{display:flex;justify-content:space-between;gap:10px;margin-top:4px}
.build{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;align-items:start}
.build .card{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:20px 22px}
.btrack{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.btrack li{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:6px 10px;background:var(--paper2)}
.btrack li svg{width:56px;height:56px}
.btrack li.cur{border-color:var(--accent)}
.btrack li.done{border-color:var(--ok);background:var(--ok-soft)}
.btrack li .yr{font-family:var(--mono);font-size:12px;color:var(--muted)}
.evq{display:flex;flex-direction:column;gap:.5em;margin-top:1em;border-top:1px solid var(--line);padding-top:1em}
.summary{background:var(--ok-soft);border-radius:14px;padding:14px 18px;margin-top:16px}
.summary h3{font-family:var(--display);margin:0 0 .3em}
.locked{background:var(--paper);border:1.5px dashed var(--line);border-radius:18px;padding:28px;max-width:760px}
.locked h2{font-family:var(--display);margin:.2em 0 .4em}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end}
.pager .pg{min-height:34px;padding:.3em .8em;font-size:.86em;white-space:nowrap}
.numrow,.qrow{min-width:0}
/* docked (missions.js dock()): the header is the top strip of the .case card and holds the pager. The card grows with its
   content and the page scrolls; the header stays frozen under the sticky bar. Sized for a 1536x726 laptop window. */
.mwrap.docked{max-width:1440px;padding:0 20px calc(12px - var(--gapcut,0px))}
/* the card hangs from the bar: no gap, no top border, square top corners */
.docked .case{grid-template-columns:minmax(0,1fr) minmax(0,1.45fr);border-top:0;border-radius:0 0 18px 18px}
/* flat (a view without a .case card, missions.js dock()): the header is a strip of its own above the view, shaped like the top of a card */
.docked.flat>.mhead{border:1px solid var(--line);border-top:0;border-radius:0 0 18px 18px;margin-bottom:16px}
.docked .mhead{grid-column:1/-1;display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"lab intro prog" "ttl intro prog";gap:0 24px;align-items:center;margin:0;padding:10px 24px;border-bottom:1px solid var(--line);background:var(--paper)}
.docked .mhead>div:first-child{display:contents}

/* ===== Keep symbols in their case inside uppercase labels =====
   Labels styled text-transform:uppercase would turn λ into Λ, f into F, h into H and nm into NM:
   different quantities and units. Any standalone symbol or lowercase unit inside such a label is
   wrapped in span.kc (text-transform:none). Runs on load and on every later DOM change, so
   readouts that sims rebuild stay correct. The English word "a" is left alone. */
(function(){
const TOK=/(^|[\s(=÷×·/,:;+−-])([b-zλνμΔδρ]|nm|pm|km|mm|cm|µm|μm|kg|mol)(?=$|[\s)=÷×·/,.:;+−-])/g;

function fix(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:t=>{
    const p=t.parentElement;if(!p||p.closest('.kc,script,style,svg,textarea,input'))return NodeFilter.FILTER_REJECT;
    TOK.lastIndex=0;return TOK.test(t.data)&&upper(p)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT}});
  const hits=[];while(w.nextNode())hits.push(w.currentNode);
  hits.forEach(t=>{const f=document.createDocumentFragment();let last=0;TOK.lastIndex=0;

}

 {id:'e-2',obj:'3.3.1',ctx:'A phone battery and the air you breathe',title:'Across period 2',

  num:{p:'How much higher is fluorine\'s electronegativity than lithium\'s?',unit:'',ans:3,tol:0.005,why:'3.98 − 0.98 = 3.00. The value rises at every step across period 2.',hint:'Not yet. Subtract lithium\'s value from fluorine\'s value.'},
  pick:{q:'Which part of today\'s table holds these seven elements?',ans:'p2',opts:[P(2),P(3),G(2)],why:'Lithium to fluorine is period 2, from group 1 to group 17.',no:'The seven elements fill one row, from lithium in group 1 to fluorine in group 17. Which row is that?'},
  q:'Why does electronegativity increase across period 2?',opts:[['Each element has one more proton pulling on the same energy level, so the shared electrons are pulled more strongly.',1,'Correct. The shielding stays about the same across the period while the nuclear charge grows.'],['Each element has more electrons, and electrons attract other electrons.',0,'Electrons repel each other. The pull on shared electrons comes from the protons in the nucleus, and fluorine has the most of these seven.'],['The atoms get larger across the period, so they have more room for electrons.',0,'The atoms get smaller across a period. In a smaller atom the shared electrons are closer to the nucleus, so they are pulled harder.']]},
 {id:'e-3',obj:'3.3.1',ctx:'Your stomach, after lunch',title:'Hydrogen and chlorine',
  ev:'<p>Your stomach makes hydrochloric acid to help digest food. It is a solution of <b>hydrogen chloride</b> in water. In one hydrogen chloride molecule, a hydrogen atom and a chlorine atom share a pair of electrons.</p>'+TBL(['Element','H','Cl'],[[EN,'2.20','3.16']]),
  num:{p:'What is the difference in electronegativity between chlorine and hydrogen?',unit:'',ans:0.96,tol:0.005,why:'3.16 − 2.20 = 0.96.',hint:'Not yet. Subtract the smaller value from the larger value.'},
  pick:{q:'Chlorine is in which group of today\'s table?',ans:'17',opts:[G(1),G(17),P(2)],why:'Chlorine is a halogen, in group 17 and period 3. Hydrogen sits above group 1 but is not an alkali metal.',no:'Chlorine is a halogen. Find the column of the halogens, one to the left of the noble gases.'},
  q:'Where are the shared electrons in a hydrogen chloride molecule?',opts:[['Closer to the chlorine atom, because chlorine has the higher electronegativity.',1,'Correct. Chlorine pulls the shared pair more strongly, so the electrons spend more time near the chlorine atom.'],['Closer to the hydrogen atom, because hydrogen is the smaller atom.',0,'Hydrogen is smaller, but its nucleus has only one proton. Chlorine has the higher electronegativity, so it pulls the pair closer.'],['Exactly halfway between the two atoms, because the electrons are shared.',0,'Sharing does not have to be equal. The two values differ by 0.96, so the pair is pulled toward one of the atoms.']]},
 {id:'e-4',obj:'3.3.1',ctx:'The clock that keeps official time',title:'Down the alkali metals',
  ev:'<p>Since 1967, the second has been defined using <b>cesium</b> atoms, and atomic clocks that use cesium help keep official time. Cesium is an alkali metal, like the lithium in phone batteries and the sodium in table salt.</p>'+TBL(['Element','Li','Na','K','Rb','Cs'],[[EN,'0.98','0.93','0.82','0.82','0.79']])+'<p>The elements are listed from the top of the group to the bottom.</p>',
  num:{p:'How much higher is lithium\'s electronegativity than cesium\'s?',unit:'',ans:0.19,tol:0.005,why:'0.98 − 0.79 = 0.19. The change down group 1 is small, because every alkali metal has a low value.',hint:'Not yet. Subtract cesium\'s value from lithium\'s value.'},
  pick:{q:'Which group of today\'s table holds these five metals?',ans:'1',opts:[G(1),G(2),G(17)],why:'Lithium to cesium are the alkali metals, in group 1 at the left edge of the table.',no:'These are the alkali metals. They fill the column at the left edge of the table.'},
  q:'Which statement fits the group 1 data?',opts:[['Electronegativity generally decreases down the group, and potassium and rubidium share the same value.',1,'Correct. The overall trend is downward. Real data can show a tie where a trend is weak.'],['Electronegativity decreases at every step down the group.',0,'Potassium and rubidium both have 0.82. The trend is general, not at every step.'],['Electronegativity increases down the group, because cesium is the most reactive of these metals.',0,'The values fall, from 0.98 to 0.79. Cesium\'s outer electron is far from its nucleus, so cesium pulls on shared electrons weakly.']]},
 {id:'e-5',obj:'3.3.1',ctx:'A neon sign',title:'Why neon has no value',
  ev:'<p>Neon glows red-orange in signs. In the periodic table it comes right after fluorine, at the end of period 2.</p>'+TBL(['Element','F','Ne'],[[IE1,'1681','2081'],[EN,'3.98','no value']])+'<p>Pauling found electronegativity values from the energies of bonds between atoms.</p>',
  num:{p:'How much more energy does it take to remove an electron from neon than from fluorine?',unit:'kJ/mol',ans:400,tol:0.5,why:'2081 kJ/mol − 1681 kJ/mol = 400 kJ/mol. Neon holds its own electrons very tightly.',hint:'Not yet. Subtract fluorine\'s value from neon\'s value.'},
  pick:{q:'Which group of today\'s table holds neon?',ans:'18',opts:[G(17),G(18),P(3)],why:'Neon is a noble gas, in group 18 at the right end of period 2.',no:'Neon is a noble gas. The noble gases fill the last column of the table.'},
  q:'Why does neon have no electronegativity value?',opts:[['Neon forms no stable compounds, so there are no neon bonds to measure.',1,'Correct. Electronegativity describes an atom in a bond. Neon has a very high ionization energy, but it forms no bonds.'],['Neon\'s electronegativity is zero, because it is a noble gas.',0,'A missing value is not zero. Neon forms no stable compounds, so no Pauling value can be found for it.'],['Neon\'s electronegativity is higher than fluorine\'s, because its ionization energy is higher.',0,'Ionization energy and electronegativity are different properties. Electronegativity needs bonds to measure, and neon forms none.']]}
 ]},
metals:{title:'Metals in water',sub:'Use observations and ionization energy',intro:'Each case describes what chemists see when a metal is dropped into water, with ionization energy data. These reactions are dangerous and are shown only on video. Calculate, choose the main reason, then pick the best explanation.',
 pickLabel:'Main reason',pickTeks:'C.5(C)',pickQ:'What is the main reason for the difference?',
 picks:[['far','Outer electron farther out',IC.level],['two','Two electrons to remove',TWO],['mass','A heavier atom',IC.mass]],
 next:'Next: Mystery halogen',
 cases:[
 {id:'w-1',obj:'3.3.2',ctx:'A chemistry demonstration video',title:'Lithium, sodium and potassium',
  ev:'<p>Behind a safety screen, a teacher drops a small piece of each metal into a large bowl of water.</p>'+TBL(['Metal','What you see',IE1],[['Lithium','floats and fizzes gently','520'],['Sodium','melts into a ball and darts across the surface','496'],['Potassium','faster still; the hydrogen catches fire with a lilac flame','419']])+'<p>These are observations, not measured rates. The three metals are in group 1, listed from the top down.</p>',
  num:{p:'How much less energy does potassium need to lose its outer electron than lithium?',unit:'kJ/mol',ans:101,tol:0.5,why:'520 kJ/mol − 419 kJ/mol = 101 kJ/mol.',hint:'Not yet. Subtract potassium\'s value from lithium\'s value.'},
  pick:{ans:'far',why:'Down group 1, each metal\'s outer electron is in a higher energy level, farther from the nucleus and shielded by more inner electrons.',no:'Each of these metals loses one electron. Look at where that electron is: each step down group 1 adds an energy level.'},
  q:'Why does potassium react with water faster than lithium?',opts:[['Its outer electron is farther from the nucleus, so it is lost more easily when the metal reacts.',1,'Correct. Group 1 metals react by losing their outer electron. The easier that is, the faster the reaction.'],['Potassium has more protons, so it pulls harder on the water.',0,'Potassium\'s extra protons are mostly shielded by its extra inner electrons. It reacts faster because its outer electron is easier to remove.'],['Potassium is heavier, so it hits the water harder.',0,'The mass of the atom does not set the speed of the reaction. Potassium reacts faster because it loses its outer electron more easily.']]},
 {id:'w-2',obj:'3.3.2',ctx:'A chemical storeroom',title:'Predict rubidium',
  ev:'<p>In school storerooms, sodium and potassium are kept under oil, so that water vapor and oxygen in the air cannot reach them. <b>Rubidium</b>, just below potassium in group 1, is usually sealed inside glass tubes filled with an unreactive gas.</p>'+TBL(['Metal','Li','Na','K','Rb'],[[IE1,'520','496','419','403']]),
  num:{p:'How much less energy does rubidium need to lose its outer electron than sodium?',unit:'kJ/mol',ans:93,tol:0.5,why:'496 kJ/mol − 403 kJ/mol = 93 kJ/mol.',hint:'Not yet. Subtract rubidium\'s value from sodium\'s value.'},
  pick:{ans:'far',why:'Rubidium\'s outer electron is in level 5, one level above potassium\'s, so it is farther out and more shielded.',no:'Rubidium and potassium each lose one electron. Compare the energy levels their outer electrons are in.'},
  q:'Which prediction for rubidium in water fits the data?',opts:[['It reacts even faster than potassium, because its outer electron is in level 5.',1,'Correct. Rubidium\'s outer electron is farther out and easier to remove, so rubidium reacts violently with water.'],['It reacts more slowly than potassium, because it is heavier.',0,'Mass does not set the speed. Rubidium\'s outer electron is easier to remove than potassium\'s, so it reacts faster.'],['It reacts the same way as sodium, because all group 1 metals are alike.',0,'All group 1 metals react with water, but not at the same speed. The speed rises down the group as the outer electron becomes easier to remove.']]},
 {id:'w-3',obj:'3.3.2',ctx:'Fireworks and a glass of milk',title:'Down group 2',
  ev:'<p>Group 2 metals react with water more slowly than group 1 metals. Calcium is in milk, and strontium and barium compounds give fireworks their red and green colors.</p>'+TBL(['Metal','In cold water',IE1],[['Beryllium','no reaction','900'],['Magnesium','reacts very slightly','738'],['Calcium','reacts fairly vigorously','590'],['Strontium','about as vigorously as lithium','549'],['Barium','about as vigorously as lithium','503']])+'<p>These are observations, not measured rates. The metals are listed from the top of group 2 down.</p>',
  num:{p:'How much lower is barium\'s first ionization energy than beryllium\'s?',unit:'kJ/mol',ans:397,tol:0.5,why:'900 kJ/mol − 503 kJ/mol = 397 kJ/mol.',hint:'Not yet. Subtract barium\'s value from beryllium\'s value.'},
  pick:{ans:'far',why:'Down group 2, the outer electrons are in a higher energy level each time, farther out and more shielded.',no:'Every group 2 metal loses two electrons, so that is not the difference here. Look at how far out the outer electrons are.'},
  q:'What pattern do the group 2 data show?',opts:[['Reactivity increases down the group as the first ionization energy falls.',1,'Correct. The outer electrons get easier to remove down the group, so the metals react faster.'],['Reactivity decreases down the group, because the atoms get larger.',0,'The observations go from no reaction to vigorous. Larger atoms hold their outer electrons less tightly, so they react faster.'],['Ionization energy and reactivity are not connected.',0,'Read the two columns together: the lower the ionization energy, the more vigorous the reaction.']]},
 {id:'w-4',obj:'3.3.3',ctx:'A salt shaker and a vitamin label',title:'Sodium and magnesium',
  ev:'<p>Table salt contains sodium, and many vitamin pills list magnesium. The two metals sit side by side in period 3. In water, sodium melts into a ball and darts across the surface, while magnesium reacts only very slightly. When they react, a sodium atom loses one electron and a magnesium atom loses two.</p>'+TBL(['Metal',IE1,IE2],[['Sodium','496','4562'],['Magnesium','738','1451']]),
  num:{p:'How much energy does it take to remove both outer electrons from a magnesium atom?',unit:'kJ/mol',ans:2189,tol:0.5,why:'738 kJ/mol + 1451 kJ/mol = 2189 kJ/mol, about 4.4 times the 496 kJ/mol that a sodium atom needs.',hint:'Not yet. Add magnesium\'s first and second ionization energies.'},
  pick:{ans:'two',why:'Magnesium must lose two electrons, and the second comes from an ion that is already positive. Sodium loses only one.',no:'Sodium and magnesium are in the same period, so their outer electrons are in the same level. Count the electrons each one loses when it reacts.'},
  q:'Why is magnesium less reactive than sodium?',opts:[['Magnesium must lose two electrons, which costs 2189 kJ/mol, while sodium loses one for 496 kJ/mol.',1,'Correct. The much larger energy cost helps explain why magnesium reacts far more slowly. A magnesium hydroxide coating on the metal slows it further.'],['Sodium\'s second ionization energy, 4562 kJ/mol, is the largest value, so sodium should react least.',0,'Sodium never loses a second electron when it reacts with water. Only the electrons that are actually lost count.'],['Magnesium is heavier than sodium, so it reacts more slowly.',0,'Mass does not set the speed. Magnesium reacts more slowly because it must lose two electrons, which costs much more energy.']]},
 {id:'w-5',obj:'3.3.3',ctx:'Garden fertilizer and a stick of chalk',title:'Potassium and calcium',
  ev:'<p>Garden fertilizers supply potassium to plants, and chalk is a calcium compound. The two metals sit side by side in period 4. In water, potassium reacts so fast that the hydrogen catches fire, while calcium reacts fairly vigorously. A potassium atom loses one electron and a calcium atom loses two.</p>'+TBL(['Metal',IE1,IE2],[['Potassium','419','3051'],['Calcium','590','1145']]),
  num:{p:'How much energy does it take to remove both outer electrons from a calcium atom?',unit:'kJ/mol',ans:1735,tol:0.5,why:'590 kJ/mol + 1145 kJ/mol = 1735 kJ/mol, about 4.1 times the 419 kJ/mol that a potassium atom needs.',hint:'Not yet. Add calcium\'s first and second ionization energies.'},
  pick:{ans:'two',why:'Calcium must lose two electrons, and potassium only one. The outer electrons of both are in level 4.',no:'Potassium and calcium are in the same period, so distance is not the main difference. Count the electrons each one loses.'},
  q:'Which statement compares potassium and calcium correctly?',opts:[['Calcium reacts more slowly, because removing its two outer electrons costs 1735 kJ/mol, against 419 kJ/mol for potassium\'s one.',1,'Correct. This is the same reason magnesium reacts more slowly than sodium.'],['Calcium reacts faster, because it has one more proton.',0,'One more proton holds the outer electrons more tightly, not less. Calcium must also lose two electrons, not one.'],['They react at the same speed, because both are in period 4.',0,'Being in the same period does not make two metals react alike. Calcium must lose two electrons, which costs about four times as much energy.']]}
 ]},
halogens:{title:'Mystery halogen',sub:'Use displacement reactions to identify an unknown',intro:'Six puzzles. Each one shows test tubes after two solutions were mixed. Read the colors, then decide what the unknown solution holds. The tubes are illustrations of results that chemists report, not photographs.',total:6,
 mount(el,api){
  const {HAL,SALT,MIX,tube}=U2.HALO,{E,txt}=U2.E3;
  /* what is seen when halogen i is added to salt j; the same halogen gives no reaction */
  const res=(i,j)=>MIX[i][j]||[0,HAL[i].col,`Stays ${HAL[i].cn}: no reaction.`];
  const HN=['Chlorine','Bromine','Iodine'],SN=SALT.map(s=>`${s.n[0].toUpperCase()+s.n.slice(1)}, ${s.s}`);
  const ASKX='A bottle of halogen solution has lost its label. It holds chlorine water, bromine water or iodine solution. Pale solutions are hard to judge by color, so a student mixes samples of it, solution X, with colorless salt solutions.';
  const ASKY='A bottle of colorless salt solution has lost its label. It holds potassium chloride, potassium bromide or potassium iodide. A student adds halogen solutions to samples of it, solution Y.';
  const SETS=[
   {y:1,tests:[0,2],ans:1,why:'Chlorine water turned Y yellow-orange, so bromine formed: Y holds bromide ions. Iodine is less reactive than bromine, so it changed nothing. Y is potassium bromide.',
    no:['Not yet. Chlorine cannot react with its own chloride, so the chlorine water tube would show no change. Look at the color that formed.','',`Not yet. Iodine cannot react with its own iodide, and chlorine would turn an iodide solution brown. Check the colors again.`]},
   {x:0,tests:[1,2],ans:0,why:'X displaced bromine from potassium bromide and iodine from potassium iodide, so it is more reactive than both. Of the three halogens, only chlorine can do that.',
    no:['','Not yet. A halogen cannot displace itself, so bromine water would cause no change in potassium bromide. Yet X changed that tube.','Not yet. Iodine is the least reactive of the three halogens. Could it displace bromine from potassium bromide?']},
   {y:2,tests:[0,1],ans:2,why:'Chlorine and bromine both made brown iodine, so Y holds iodide ions. Y is potassium iodide.',
    no:['Not yet. Chlorine is the most reactive of the three, so bromine could not displace anything from a chloride. Yet both tubes changed.','Not yet. Bromine cannot react with its own bromide, so that tube would show no change. Look at the bromine water tube again.','']},
   {x:1,tests:[0,1,2],ans:1,why:'X displaced iodine but not chlorine, so it is less reactive than chlorine and more reactive than iodine. That is bromine. Its own salt, potassium bromide, shows no change.',
    no:['Not yet. Chlorine would displace bromine from potassium bromide, so that tube would turn a new color. Read the words under each tube: does it stay or turn?','','Not yet. Iodine is the least reactive of the three, so it could not displace anything. Yet one tube changed color.']},
   {y:0,tests:[0,1,2],ans:0,why:'No halogen changed Y. Chlorine is the most reactive of the three, so bromine and iodine cannot displace it from a chloride. Y is potassium chloride.',
    no:['','Not yet. Chlorine water would displace bromine from a bromide and turn the solution yellow-orange. Look at the chlorine water tube.','Not yet. Chlorine and bromine would both make brown iodine from an iodide. Look at the chlorine water and bromine water tubes.']},
   {explain:true,ans:1,q:'Chlorine displaces bromine and iodine, and bromine displaces only iodine. Why is chlorine the most reactive of the three?',
    opts:['A chlorine atom has the most protons, so it pulls hardest on an extra electron.','A chlorine atom is the smallest, so an incoming electron comes closer to the nucleus and is pulled more strongly.','An iodine atom is the heaviest, so it is too slow to react.'],
    why:'A halogen reacts by gaining one electron. Chlorine\'s outer level is closest to its nucleus, with the fewest inner electrons shielding it, so it attracts an extra electron most strongly.',
    no:['Not yet. Count the protons: chlorine has 17, bromine 35 and iodine 53. Look at the radius row instead.','','Not yet. Mass does not set how strongly an atom attracts an extra electron. Look at the radius row.']}];
  el.innerHTML=`<article class="case halo"><div class="ev"><p class="ctx">Displacement puzzles <span class="oid">· Objective 3.3.4 · C.5(C) · SEP 2(C)</span></p><h2>Find the unknown</h2><div class="evb">
   <p><b>1. Read each tube.</b> A color change means a reaction happened. Salt solutions are colorless.</p>
   <p><b>2. Know the colors.</b> Chlorine water is pale yellow-green, bromine is yellow-orange and iodine is brown.</p>
   <p><b>3. Use the rule.</b> A more reactive halogen takes electrons from the halide ions of a less reactive one, so the less reactive halogen forms. A halogen added to its own halide causes no change.</p></div></div>
   <div class="tasks"><div class="rdots" id="hdots" role="group" aria-label="Choose a puzzle"></div><div id="hmap"></div><div class="task" id="htask"></div></div></article>
   <div class="cnav"><span></span><button class="btn primary" id="hnext" type="button">Finish</button></div>`;
  const map=el.querySelector('#hmap'),box=el.querySelector('#htask');
  const fig=(col,lab,seen)=>`<figure>${tube(col,`${lab.replace(/<[^>]+>/g,'')}: ${seen}`)}<figcaption><b>${lab}</b><span>${seen.split(':')[0]}</span></figcaption></figure>`;
  U2.M3.sets(api,{key:'halodone',count:SETS.length,dots:el.querySelector('#hdots'),next:el.querySelector('#hnext'),noun:'Puzzle',show(i,ok,solve){
   const s=SETS[i];
   if(s.explain)map.innerHTML=`<p>All the results so far point to one order of reactivity: chlorine &gt; bromine &gt; iodine. These data compare the three atoms.</p>`+
     TBL(['Halogen','Cl','Br','I'],[['Protons','17','35','53'],['Atomic radius (pm)',...[17,35,53].map(z=>txt(z,'r'))]]);
   else map.innerHTML=`<p>${s.x!=null?ASKX:ASKY}</p><div class="htubes">${s.tests.map(t=>{const[,col,seen]=s.x!=null?res(s.x,t):res(t,s.y);
     return fig(col,s.x!=null?`X + ${SALT[t].s}`:`${HAL[t].s} + Y`,seen)}).join('')}</div>`;
   const q=s.explain?s.q:s.x!=null?'Which halogen is in solution X?':'Which salt is in solution Y?';
   const opts=s.explain?s.opts:s.x!=null?HN:SN;
   box.className='task'+(ok?' ok':'');
   box.innerHTML=`<p class="tl"><b>Puzzle ${i+1} of ${SETS.length} · ${s.explain?'Explain':s.x!=null?'Unknown halogen':'Unknown salt'}</b><span>C.5(C)</span></p><p class="q">${q}</p><div class="hopts"></div><p class="fbx" hidden></p>`;
   const ob=box.querySelector('.hopts'),fb=box.querySelector('.fbx');
   const right=()=>{fb.hidden=false;fb.className='fbx ok';fb.innerHTML='✓ Correct. '+s.why;box.classList.add('ok')};
   opts.forEach((t,k)=>{const b=document.createElement('button');b.type='button';b.className='btn'+(ok&&k===s.ans?' correct':'');b.textContent=t;
    b.onclick=()=>{if(ok)return;ob.querySelectorAll('.btn').forEach(x=>x.classList.remove('correct','wrong'));
     if(k===s.ans){b.classList.add('correct');ok=true;right();solve();return}
     b.classList.add('wrong');fb.hidden=false;fb.className='fbx no';fb.textContent=s.no[k]};
    ob.append(b)});
   if(ok)right()}})}}
};
})();

(function(){

const firstScore=cs=>{const p=prog();let a=0,t=0;cs.forEach(c=>tasksOf(c).forEach(k=>{const f=(p[c.id]||{})['f_'+k];if(f!==undefined){t++;if(f===1)a++}}));return[a,t]};

function lines(el){const S=el.dataset.lines.split(',').map(t=>t.trim()),L=S.map(Number),W=600,X=l=>10+(W-20)*(l-380)/320;

  const abs=!!el.dataset.abs,gid='g'+Math.random().toString(36).slice(2,7);const bg=abs?`<defs><linearGradient id="${gid}">${[380,420,460,500,540,580,620,660,700].map(l=>`<stop offset="${(l-380)/320}" stop-color="${U2.wl2rgb(l)}"/>`).join('')}</linearGradient></defs><rect x="10" y="4" width="${W-20}" height="34" rx="4" fill="url(#${gid})"/>`:`<rect x="10" y="4" width="${W-20}" height="34" rx="4" fill="#0b0b12"/>`;

function head(m){$('#msub').textContent=m.sub;$('#mtitle').textContent=m.title;$('#mintro').textContent=m.intro}
/* the mission header docks as the top strip of a view's .case card, so the card starts near the top of the screen; render() undocks it first */
const MH=$('.mhead');
/* the dots sit in a .pager row with Previous and Next; a unit's case file has its own page.html without that wrapper, so add it here */
if(!$('.pager',MH)){const pg=document.createElement('div');pg.className='pager';$('#dots').before(pg);pg.append($('#dots'))}
/* the frozen parts (missions.css): the docked header is sticky just under the sticky bar, so it needs the bar's height, which
   changes when its tabs wrap; the evidence column is sticky just under the header, so it needs the header's height too, and a
   column taller than the space under them sticks by its bottom (--evtop), so its end comes into view as the page scrolls.
   Each is watched by its outer size (BB), as frz() reads it: fit() trims the columns' bottom padding, which changes the column's
   height and not its content's */
const BAR=$('header.bar'),BB={box:'border-box'};let evSeen=null;
function frz(){const b=BAR.offsetHeight,h=MH.offsetHeight,c=$('#mbody>.case'),ev=c&&$(':scope>.ev',c);root.style.setProperty('--barh',b+'px');root.style.setProperty('--mhh',h+'px');
  if(ev){const t=innerHeight-ev.offsetHeight;if(t<b+h)c.style.setProperty('--evtop',t+'px');else c.style.removeProperty('--evtop')}}
const frzRO=new ResizeObserver(frz);frzRO.observe(BAR,BB);frzRO.observe(MH,BB);addEventListener('resize',frz);
/* stuck: the page has scrolled, so the frozen header gets a shadow over the content passing under it */
addEventListener('scroll',()=>$('#m').classList.toggle('stuck',scrollY>0),{passive:true});
/* a case that fits the window once the spare space under its last task is taken away does not scroll the page for that space:
   up to 12px of the gap under the card, then up to 14px of the columns' 18px bottom padding (missions.css), only as much as it needs.
   Measured from the untrimmed size, so trimming never feeds back; the observer defers to a frame so it never resizes in its own callback */
const fitRO=new ResizeObserver(()=>requestAnimationFrame(fit));addEventListener('resize',fit);
function fit(){const M=$('#m'),c=$('#mbody>.case');let o=0;
  if(c&&M.classList.contains('docked')){o=Math.ceil(c.getBoundingClientRect().bottom+scrollY+(parseFloat(M.style.getPropertyValue('--padcut'))||0)+12-innerHeight);if(o>26)o=0}
  o=Math.max(0,o);M.style.setProperty('--gapcut',Math.min(o,12)+'px');M.style.setProperty('--padcut',Math.max(0,o-12)+'px')}
/* an element whose bottom is below the window's bottom edge scrolls the page up to it, and only that far, so a tall task does not
   jump to its top; a custom tab calls it as api.reveal(el) for a result outside a task card */
const reveal=el=>{const d=el.getBoundingClientRect().bottom+16-innerHeight;if(d>0)scrollBy({top:d,behavior:'smooth'})};
/* feedback that a click changed in a task card is revealed. A click that changes no feedback (the table's Color by buttons) leaves
   the page where it is: the capture listener notes the task's feedback before the click's own handler runs. composedPath, not
   target.closest: a check re-renders its buttons on answer, so the clicked one is already detached. On #mbody, which every view renders into */
{const task=e=>e.composedPath().find(x=>x.classList&&x.classList.contains('task')),fbs=t=>$$('.fbx,.fb,.say',t).map(f=>[f,f.hidden+f.className+f.innerHTML]);let was=[];
  $('#mbody').addEventListener('click',e=>{const t=task(e);was=t?fbs(t).map(x=>x[1]):[]},true);
  $('#mbody').addEventListener('click',e=>{const t=task(e);if(t)setTimeout(()=>{const fb=fbs(t).filter(([f,s],i)=>s!==was[i]&&!f.hidden&&f.textContent.trim()).map(x=>x[0]).pop();
    if(fb)reveal(fb)},60)})}
/* answer-button rows (.mbtns, missions.css): balanced rows with no empty slot and no button alone on the last row (four make 2+2
   where four across do not fit, five 3+2, seven 3+2+2), as many across as fit at --mbmin each and never more than --mbmax, and
   fewer when a label's word would be cut, once each icon above its label (.stk) has not saved that count. The row becomes a
   grid of L columns, each button spanning L / the buttons in its row. A row a lesson made a flex row is left alone.
   A Decide row in one line (.check .opts, missions.css) keeps its order and widths, except that a button whose longest word
   is wider than its share keeps that word's width; if the row then overflows, it wraps.
   Laid out when a row appears and whenever its size changes, a frame later, so a layout never resizes a row inside its own
   observer callback */
const plan=(n,k)=>{for(let r=Math.ceil(n/k);;r++){const c=Math.ceil(n/r),big=n-(c-1)*r;if(big===r||c>2)return Array.from({length:r},(_,i)=>i<big?c:c-1)}};
const cut=b=>b.scrollWidth>b.clientWidth+1;
function optRow(o){const bs=[...o.children];o.style.flexWrap='';bs.forEach(b=>b.style.minWidth='');if(getComputedStyle(o).display!=='flex')return;
  for(let c;(c=bs.filter(b=>!b.style.minWidth&&cut(b))).length;)c.forEach(b=>b.style.minWidth='min-content');
  if(cut(o))o.style.flexWrap='wrap'}
function rows(mb){if(mb.matches('.opts'))return optRow(mb);const cs=getComputedStyle(mb),bs=[...mb.children],w=mb.clientWidth;if(cs.display!=='grid'||!bs.length||!w)return;
  const g=parseFloat(cs.columnGap)||0,ico=bs.some(b=>b.children.length>1);let k=Math.min(bs.length,parseInt(cs.getPropertyValue('--mbmax'))||99,Math.max(1,Math.floor((w+g)/((parseFloat(cs.getPropertyValue('--mbmin'))||0)+g))));
  for(;;){const R=plan(bs.length,k),c=R[0],L=R[R.length-1]<c?c*(c-1):c;let i=0;mb.style.gridTemplateColumns=`repeat(${L},minmax(0,1fr))`;
    R.forEach(x=>{for(let j=0;j<x;j++)bs[i++].style.gridColumn=L>x?'span '+L/x:''});
    mb.classList.remove('stk');if(!bs.some(cut))return;
    if(ico){mb.classList.add('stk');if(!bs.some(cut))return;mb.classList.remove('stk')}
    if(c===1)return;k=c-1}}
{const ro=new ResizeObserver(es=>requestAnimationFrame(()=>es.forEach(e=>rows(e.target)))),seen=new WeakSet(),all=()=>$$('#mbody .mbtns,#mbody .check .opts');
  new MutationObserver(()=>all().forEach(x=>{if(!seen.has(x)){seen.add(x);ro.observe(x)}})).observe($('#mbody'),{childList:true,subtree:true});
  document.fonts&&document.fonts.ready.then(()=>all().forEach(rows))}
/* a view that starts with a .case card takes the header as the card's top strip. Any other view (a case file's briefing or
   recommendation, a build, the Case file tab) docks flat: the header stays above it as the same compact strip, frozen under the bar */
function dock(){const c=$('#mbody>.case'),M=$('#m'),ev=c&&$(':scope>.ev',c);if(c)c.prepend(MH);M.classList.add('docked');M.classList.toggle('flat',!c);fitRO.disconnect();if(c)fitRO.observe(c);fit();
  if(evSeen)frzRO.unobserve(evSeen);evSeen=ev;if(ev)frzRO.observe(ev,BB);frz();
  /* a custom tab's own .cnav (under its card, or at the top level of a flat view) joins the pager: plain buttons before the dots, the primary one after */
  const n=c?c.nextElementSibling:$('#mbody>.cnav');if(n&&n.classList.contains('cnav')){$$('button',n).forEach(x=>{x.classList.add('pg');x.classList.contains('primary')?$('.pager',MH).append(x):$('#dots').before(x)});n.remove()}}
function undock(){$('#m').insertBefore(MH,$('#mbody'));$('#m').classList.remove('docked','flat');$$('.pg',MH).forEach(b=>b.remove())}
function caseView(key){const m=M[key],cs=m.cases,i=idx[key]=Math.min(idx[key]??0,cs.length-1),c=cs[i];head(m);
  const dots=$('#dots');dots.innerHTML='';cs.forEach((x,k)=>{const b=document.createElement('button');b.type='button';b.textContent=k+1;b.className=(k===i?'cur ':'')+(solved(x)?'done':partial(x)?'part':'');b.setAttribute('aria-label','Case '+(k+1)+(solved(x)?', solved':partial(x)?', in progress':''));b.onclick=()=>{idx[key]=k;render()};dots.append(b)});
  const[a,t]=firstScore(cs);$('#mscore').textContent=`${cs.filter(solved).length} of ${cs.length} cases solved · first-try accuracy ${t?Math.round(100*a/t)+'%':'–'}`;
  const o=window.OBJ[c.obj];const body=$('#mbody');
  body.innerHTML=`<article class="case"><div class="ev"><p class="ctx">${c.ctx} <span class="oid">· Objective ${c.obj} · ${o.teks}</span></p><h2>${c.title}</h2><div class="evb">${c.ev}</div></div><div class="tasks" id="tasks"></div></article>`;
  dots.before(Object.assign(document.createElement('button'),{className:'btn pg',id:'cprev',type:'button',textContent:'← Previous'}));
  dots.after(Object.assign(document.createElement('button'),{className:'btn pg',id:'cnext',type:'button',textContent:'Next case →'}));
  $$('[data-lines]',body).forEach(lines);
  const T=$('#tasks',body);let n=0;const P=prog()[c.id]||{};
  nums(c).forEach((nm,ni)=>{const key='num'+(ni||'');n++;const d=document.createElement('div');d.className='task';d.innerHTML=`<p class="tl"><b>Task ${n} · Calculate</b><span>SEP 2(C)</span></p><div class="qrow"><p class="q">${nm.p}</p><div class="numrow"><input type="number" step="any" inputmode="decimal" aria-label="${nm.p.replace(/<[^>]+>/g,'')}"><span class="u">${nm.unit}</span><button class="btn" type="button">Check</button></div></div><p class="fbx" hidden></p>`;
    const inp=$('input',d),fb=$('.fbx',d);const show=ok=>{fb.hidden=false;fb.className='fbx '+(ok?'ok':'no');fb.innerHTML=ok?'✓ '+nm.why:(nm.hint||'Not yet. Check which quantities to compare, then try again.');d.classList.toggle('ok',ok)};
    $('button',d).onclick=()=>{const v=parseFloat(inp.value);if(isNaN(v)){fb.hidden=false;fb.className='fbx no';fb.textContent='Enter a number first.';return}const ok=Math.abs(v-nm.ans)<=nm.tol;setProg(c.id,key,ok?1:0);show(ok);upd()};
    if(P[key]===1){inp.value=nm.ans;show(true)}T.append(d)});
  const pk=c.pick||(c.model?{ans:c.model,why:c.modelWhy}:null);
  if(pk){n++;const dm=document.createElement('div');dm.className='task';dm.innerHTML=`<p class="tl"><b>Task ${n} · ${m.pickLabel||'Model'}</b><span>${m.pickTeks||o.teks}</span></p><p class="q">${pk.q||m.pickQ||'Which model first explained this evidence?'}</p><div class="mbtns"></div><p class="fbx" hidden></p>`;
    const mb=$('.mbtns',dm),mf=$('.fbx',dm);
    (pk.opts||picksFor(m)).forEach(([k,name,icon])=>{const b=document.createElement('button');b.type='button';b.className='btn';b.innerHTML=(icon||'')+`<span>${name}</span>`;
      b.onclick=()=>{$$('.btn',mb).forEach(x=>x.classList.remove('correct','wrong'));const ok=k===pk.ans;b.classList.add(ok?'correct':'wrong');setProg(c.id,'model',ok?1:0);mf.hidden=false;mf.className='fbx '+(ok?'ok':'no');
        mf.innerHTML=ok?'✓ '+pk.why:(pk.no||m.pickNo||`Not ${name}. Ask which model first had the idea this evidence needs. Earlier models lacked it; later ones inherited it.`);dm.classList.toggle('ok',ok);upd()};mb.append(b);
      if(P.model===1&&k===pk.ans){b.classList.add('correct');mf.hidden=false;mf.className='fbx ok';mf.innerHTML='✓ '+pk.why;dm.classList.add('ok')}});
    T.append(dm)}
  n++;const dq=document.createElement('div');dq.className='task';dq.innerHTML=`<p class="tl"><b>Task ${n} · Decide</b><span>SEP 3(A)</span></p><div class="ck"></div>`;
  U2.renderCheck($('.ck',dq),{id:c.id,obj:c.obj,q:c.q,opts:c.opts},{label:'',onAnswer:ok=>{setProg(c.id,'mc',ok?1:0);dq.classList.toggle('ok',ok);upd()}});
  if(P.mc===1)dq.classList.add('ok');T.append(dq);
  $('#cprev').disabled=i===0;$('#cprev').onclick=()=>{idx[key]=i-1;render()};
  const nx=$('#cnext');if(i===cs.length-1){nx.textContent='Finish';nx.onclick=()=>summary(key)}else nx.onclick=()=>{idx[key]=i+1;render()};
  /* Next stays a plain button while the case is open and turns primary once it is solved: the cue to move on */
  const go=()=>nx.classList.toggle('primary',solved(c));go();
  function upd(){tabs();go();const d=$$('#dots button')[i];if(d)d.className='cur '+(solved(c)?'done':partial(c)?'part':'');const[a2,t2]=firstScore(cs);$('#mscore').textContent=`${cs.filter(solved).length} of ${cs.length} cases solved · first-try accuracy ${t2?Math.round(100*a2/t2)+'%':'–'}`}
  window.scrollTo({top:0})}
/* the summary opens at the top of the tasks column, inside the card, and replaces any earlier one; no accuracy before any attempt */
function summary(key){const cs=M[key].cases,[a,t]=firstScore(cs),s=cs.filter(solved).length;$$('.summary').forEach(x=>x.remove());const box=document.createElement('div');box.className='summary';box.setAttribute('role','status');
  box.innerHTML=`<h3>${s===cs.length?'Mission complete':'Almost there'}</h3><p>${s} of ${cs.length} cases solved.${t?` First-try accuracy: ${Math.round(100*a/t)}%.`:''} ${s<cs.length?'Open the dots that are not green to finish the remaining cases.':(M[key].next||'Next: the Unit 3 case file.')}</p>`;
  const T=$('#tasks');if(T){T.prepend(box);scrollTo({top:0,behavior:'smooth'})}else{$('#mbody').append(box);box.scrollIntoView({behavior:'smooth'})}}
function buildView(){const m=M.build;head(m);let built=store.get('built',[]);const T=m.targets;let cur=T.find(t=>!built.includes(t))||T[T.length-1];
  const dots=$('#dots');dots.innerHTML='';T.forEach((t,k)=>{const b=document.createElement('button');b.type='button';b.textContent=k+1;b.className=(t===cur?'cur ':'')+(built.includes(t)?'done':'');b.onclick=()=>{cur=t;draw()};dots.append(b)});
  $('#mscore').textContent=`${built.length} of ${T.length} models built`;
  const body=$('#mbody');body.innerHTML=`<div class="build"><div class="card" id="bwork"></div><div class="card"><p class="label">Your model timeline</p><ol class="btrack" id="btrack"></ol></div></div>`;
  function track(){$('#btrack').innerHTML=T.map(t=>{const x=U2.TARGETS[t];return`<li class="${built.includes(t)?'done':''} ${t===cur?'cur':''}">${built.includes(t)?U2.modelSVG({pos:x.pos,e:x.e,m:x.m},'bt'+t):U2.modelSVG({pos:-1,e:-1,m:-1},'bt'+t)}<span><b>${x.name.replace(/ \(.*/,'')}</b><br><span class="yr">${x.name.match(/\((.*)\)/)[1]}</span></span></li>`}).join('')}
  function draw(){const w=$('#bwork');w.innerHTML='';const bd=document.createElement('div');w.append(bd);
    $$('#dots button').forEach((b,k)=>b.className=(T[k]===cur?'cur ':'')+(built.includes(T[k])?'done':''));
    U2.modelBuilder(bd,{target:cur,onDone:ok=>{if(!ok)return;const wi=m.why[cur];if(wi===undefined){finish();return}
      const q=document.createElement('div');q.className='evq';q.innerHTML=`<p class="q"><b>Which evidence forced this model?</b></p>`;const s=document.createElement('select');s.append(new Option('Choose the evidence…',''));m.ev.forEach((e,i)=>s.append(new Option(e,i)));
      const c=U2.btn('Check','btn');const f=document.createElement('p');f.className='fbx';f.hidden=true;const r=document.createElement('div');r.className='numrow';r.append(s,c);q.append(r,f);w.append(q);
      c.onclick=()=>{const ok=+s.value===wi&&s.value!=='';f.hidden=false;f.className='fbx '+(ok?'ok':'no');f.innerHTML=ok?'✓ Right. '+U2.TARGETS[cur].why.e:'Not that one. Which result could the previous model not explain?';if(ok)finish()}}});
    track()}
  function finish(){if(!built.includes(cur)){built.push(cur);store.set('built',built)}tabs();$('#mscore').textContent=`${built.length} of ${T.length} models built`;track();
    const nxt=T.find(t=>!built.includes(t));const w=$('#bwork');const b=U2.btn(nxt?'Next model →':'All five built. Go to Models at work →','btn primary');b.style.marginTop='12px';b.onclick=()=>{if(nxt){cur=nxt;draw()}else{tab='work';store.set('mtab','work');render()}};w.append(b)}
  draw()}
function caseFile(){$('#msub').textContent='Unit 3 capstone';$('#mtitle').textContent='Case file: Can sodium stand in for lithium?';$('#mintro').textContent='';$('#dots').innerHTML='';$('#mscore').textContent='';
  $('#mbody').innerHTML=`<div class="locked"><p class="label">Unit 3 case file</p><h2>Should a Texas battery pilot test sodium in place of lithium?</h2><p>You advise a fictional Texas electric cooperative. Six evidence files use the periodic table to compare lithium and sodium, covering C.5(A), C.5(B) and C.5(C), and end in a recommendation you write in your notebook.${M.caseNote?' '+M.caseNote:''}</p><p><a class="btn primary" href="${M.caseUrl||'casefile.html'}">Open the case file →</a></p></div>`}
/* custom tab: the lesson mounts its own activity and reports progress through api.done(n) */
function customView(k){const m=M[k];head(m);$('#dots').innerHTML='';const sc=()=>{const d=store.get('cdone',{});$('#mscore').textContent=m.total?`${d[k]||0} of ${m.total} done`:''};
  const body=$('#mbody');body.innerHTML='';
  m.mount(body,{store,reveal,done(n){const d=store.get('cdone',{});d[k]=Math.max(d[k]||0,n);store.set('cdone',d);tabs();sc()},
    next(){const i=ORDER.indexOf(k);tab=ORDER[i+1]||'case';store.set('mtab',tab);render()}});
  sc();window.scrollTo({top:0})}
function render(){tabs();undock();if(tab==='case')caseFile();else{const kd=kind(tab);if(kd==='cases')caseView(tab);else if(kd==='build')buildView();else if(kd==='custom')customView(tab)}dock()}
