<script>
/* ===== Animations for Lesson 4.5 (plan section 4). Each is a Deck.sim with named stages; every stage is a full state. =====
   Shared data: D.chem (EN, CPK, uni), D.util. Period 1 (workshop step 02): brickBag, meltScale, threeSolids, attractions, bpPlot,
   forceDecider. Drawing code of the unit (RULES 8, plan section 3): a bond within a molecule is a solid gray stick; every attraction
   between molecules is dashed (dispersion gray and flickering, dipole-dipole warm to teal, hydrogen bond teal and heavier, always
   from an H to a lone pair); a lone pair is a translucent violet lobe; ions red "+" and blue "−"; CPK colors with the symbol on
   every sphere. Ball-and-stick radii: Cordero 2008 covalent radii compressed by +40 pm (as 4.2's polyIons does: H 0.30, O 0.44),
   so hydrogen keeps a 60 px sphere; each drawing has one scale for bond lengths (real lengths in pm) and one for radii, so the
   radii never set the bond lengths. Ions: Shannon radii (Na+ 102 pm, Cl- 181 pm) and the 282 pm spacing, to scale. */
(function(){
const D=window.Deck;
const {EN,uni}=D.chem,{clamp,lerp,f2,hash,rgba}=D.util;
const SANS="'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif",MONO="'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace";
/* CPK colors: the shared table (H C N O S P) plus the elements this lesson draws (Jmol values): F, Cl, Br, Si */
const CPK=Object.assign({},D.chem.CPK,{F:'#90e050',Cl:'#1ff01f',Br:'#a62929',Si:'#f0c8a0'});
const COV={H:31,C:76,N:71,O:66,F:57,Cl:102,Br:120,Si:111};                 /* Cordero 2008, pm */
const BL={HH:74,ClCl:199,FF:142,HCl:127,HO:96,HN:101,HC:109,HBr:141,CO:116,SiO:161}; /* bond lengths, pm */
const rad=(s,u)=>(COV[s]+40)/71*30*(u==null?1:u);                          /* H: 30 px at u = 1 */
const TAU=Math.PI*2,deg=a=>a*Math.PI/180;
const fam=s=>String(s).split('/')[0];
/* width of chem markup at a size, without drawing (matches painter.chem) */
function chemW(g,s,px,o){o=o||{};const ctx=g.ctx,re=/([_^])(\{[^}]*\}|.)/g,runs=[];let i=0,m;
  while((m=re.exec(s))){if(m.index>i)runs.push([s.slice(i,m.index),0]);runs.push([m[2].replace(/[{}]/g,''),1]);i=re.lastIndex}
  if(i<s.length)runs.push([s.slice(i),0]);let w=0;
  runs.forEach(([t,k])=>{ctx.font=(o.wt||700)+' '+(k?Math.round(px*.7):px)+'px '+(o.mono?MONO:SANS);w+=ctx.measureText(t).width});return w}
/* word-wrap plain text to a width; returns the lines */
function wrap(g,s,maxW,px,wt){g.font(px,wt);const out=[];let line='';
  s.split(' ').forEach(w=>{const t=line?line+' '+w:w;if(line&&g.ctx.measureText(t).width>maxW){out.push(line);line=w}else line=t});if(line)out.push(line);return out}
/* a label "x: y" breaks after the colon when it needs more than one line */
function colonLines(g,txt,maxW,px){g.font(px,700);if(g.ctx.measureText(txt).width<=maxW)return [txt];const i=txt.indexOf(': ');
  return i>0?[txt.slice(0,i+1)].concat(wrap(g,txt.slice(i+2),maxW,px)):wrap(g,txt,maxW,px)}
/* draw wrapped lines; returns the rect they cover */
function lines(g,arr,x,y,px,lh,o){o=o||{};let w=0;g.font(px,o.wt);arr.forEach(t=>{w=Math.max(w,g.ctx.measureText(t).width)});
  arr.forEach((t,i)=>g.text(t,x,y+i*lh,px,o));const x0=o.align==='left'?x:o.align==='right'?x-w:x-w/2;return {x:x0,y:y-lh/2,w,h:lh*arr.length}}
/* a shaded sphere with its symbol (label 36 px or more) */
function ball(g,x,y,r,sym,o){o=o||{};const ctx=g.ctx,col=o.color||CPK[sym]||'#999999';
  const gr=ctx.createRadialGradient(x-r*.38,y-r*.42,r*.06,x,y,r);gr.addColorStop(0,D.mix(col,'#ffffff',.62));gr.addColorStop(.5,col);gr.addColorStop(1,D.mix(col,'#000000',.36));
  g.circle(x,y,r,gr,D.mix(col,'#000000',.5),3);
  if(o.label!==false)g.chem(o.label||sym,x,y+1,Math.max(36,Math.min(o.px||r*.95,60)),{color:o.ink||(D.lum(col)>.3?'#10201c':'#ffffff')})}
/* a bond within a molecule: a solid gray stick */
const STICK='#8f989d',STICK2='#4d5559';
function stick(g,x0,y0,x1,y1,w){g.line(x0,y0,x1,y1,STICK2,w+6);g.line(x0,y0,x1,y1,STICK,w)}
/* a lone pair: a translucent violet lobe (two electron dots) standing out from atom A along ang; drawn behind the atom */
function lobe(g,A,ang){const ctx=g.ctx,e=g.c('e'),sz=A.r*.8,d=A.r+sz*.42,cx=A.x+Math.cos(ang)*d,cy=A.y+Math.sin(ang)*d;
  ctx.save();ctx.translate(cx,cy);ctx.rotate(ang);ctx.beginPath();ctx.ellipse(0,0,sz,sz*.64,0,0,TAU);
  ctx.fillStyle=rgba(e,.3);ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=rgba(e,.85);ctx.stroke();
  [-1,1].forEach(k=>g.circle(sz*.3,k*sz*.27,8,e,D.mix(e,'#000000',.4),2));ctx.restore()}
/* dashed attraction lines */
function dashGray(g,x0,y0,x1,y1,a){if(a<.01)return;const ctx=g.ctx;ctx.save();ctx.globalAlpha*=a;g.line(x0,y0,x1,y1,g.c('muted'),5,[14,12]);ctx.restore()}
function dashDipole(g,x0,y0,x1,y1,a){if(a<.01)return;const ctx=g.ctx;ctx.save();ctx.globalAlpha*=a;const gr=ctx.createLinearGradient(x0,y0,x1,y1);
  gr.addColorStop(0,g.c('dplus'));gr.addColorStop(1,g.c('dminus'));ctx.beginPath();ctx.setLineDash([16,12]);ctx.lineCap='round';ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);
  ctx.lineWidth=7;ctx.strokeStyle=gr;ctx.stroke();ctx.setLineDash([]);ctx.restore()}
function dashH(g,x0,y0,x1,y1,a){if(a<.01)return;const ctx=g.ctx;ctx.save();ctx.globalAlpha*=a;g.line(x0,y0,x1,y1,g.c('dminus'),9,[18,12]);ctx.restore()}
/* a chip: rounded box with chem text; returns its width */
function chip(g,x,y,txt,o){o=o||{};const px=o.px||40,w=chemW(g,txt,px,o)+36,h=px+22;if(o.measure)return w;
  g.rrect(x,y-h/2,w,h,14,g.c('card2'),g.c('line'),3);g.chem(txt,x+18,y+1,px,{align:'left',mono:o.mono,color:g.c('ink')});return w}
/* the label line, then chips on the next line (RULES 7); returns the rect */
function chipRow(g,x,y,label,chips,o){o=o||{};const gap=16;let w=0;chips.forEach(c=>{w+=chip(g,0,0,c,{measure:true})+gap});w-=gap;
  const x0=o.align==='center'?x-w/2:x;g.text(label,o.align==='center'?x:x0,y,36,{align:o.align==='center'?'center':'left',color:g.c('muted'),wt:700});
  let cx=x0;chips.forEach(c=>{cx+=chip(g,cx,y+58,c)+gap});g.font(36,700);const lw=g.ctx.measureText(label).width;
  const left=o.align==='center'?Math.min(x0,x-lw/2):x0;return {x:left-12,y:y-30,w:Math.max(w,lw)+24,h:58+31+30+12}}
const fade=(g,a,fn)=>{if(a<.01)return;g.ctx.save();g.ctx.globalAlpha*=Math.min(1,a);fn();g.ctx.restore()};
/* a molecule in 2D: atoms [{s,x,y,r,z}], bonds [[i,j]]; lobes [{i,ang}] behind; atoms drawn far to near (z) */
function mol2d(g,M,a){fade(g,a==null?1:a,()=>{(M.lobes||[]).forEach(L=>lobe(g,M.atoms[L.i],L.ang));
  const items=M.atoms.map((A,i)=>({z:A.z||0,i})).concat(M.bonds.map(([i,j])=>({z:Math.min(M.atoms[i].z||0,M.atoms[j].z||0)-.5,b:[i,j]}))).sort((u,v)=>u.z-v.z);
  items.forEach(it=>{if(it.b){const A=M.atoms[it.b[0]],B=M.atoms[it.b[1]];stick(g,A.x,A.y,B.x,B.y,Math.max(10,Math.min(A.r,B.r)*.42))}
    else{const A=M.atoms[it.i];ball(g,A.x,A.y,A.r,A.s,{color:A.color,label:A.label,ink:A.ink})}})})}
/* molecule builders: center (x,y), rotation rot, bond scale sb (px per pm), radius scale u */
function diatomic(a,b,bl,x,y,rot,sb,u){const d=bl*sb,c=Math.cos(rot),s=Math.sin(rot),ra=rad(a,u),rb=rad(b,u);
  return {atoms:[{s:a,x:x-c*d/2,y:y-s*d/2,r:ra},{s:b,x:x+c*d/2,y:y+s*d/2,r:rb}],bonds:[[0,1]]}}
function water(x,y,rot,sb,u){const a1=rot,a2=rot+deg(104.5),bis=rot+deg(52.25),d=BL.HO*sb;
  return {atoms:[{s:'O',x,y,r:rad('O',u)},{s:'H',x:x+Math.cos(a1)*d,y:y+Math.sin(a1)*d,r:rad('H',u)},{s:'H',x:x+Math.cos(a2)*d,y:y+Math.sin(a2)*d,r:rad('H',u)}],
    bonds:[[0,1],[0,2]],lobes:[{i:0,ang:bis+Math.PI-deg(56)},{i:0,ang:bis+Math.PI+deg(56)}]}}
/* NH3 seen slightly from above: two H in the plane, one toward the viewer (drawn in front, foreshortened); the lone pair opposite */
function ammonia(x,y,rot,sb,u){const d=BL.HN*sb,H=(ang,k,z)=>({s:'H',x:x+Math.cos(rot+ang)*d*k,y:y+Math.sin(rot+ang)*d*k,r:rad('H',u),z});
  return {atoms:[{s:'N',x,y,r:rad('N',u),z:0},H(deg(-20),1,-1),H(deg(110),.95,-1),H(deg(45),.62,1)],bonds:[[0,1],[0,2],[0,3]],lobes:[{i:0,ang:rot+deg(212)}]}}
/* CH4: one H up, two to the sides below, one toward the viewer */
function methane(x,y,rot,sb,u){const d=BL.HC*sb,H=(ang,k,z)=>({s:'H',x:x+Math.cos(rot+ang)*d*k,y:y+Math.sin(rot+ang)*d*k,r:rad('H',u),z});
  return {atoms:[{s:'C',x,y,r:rad('C',u),z:0},H(deg(-90),1,-1),H(deg(20),.98,-1),H(deg(160),.98,-1),H(deg(95),.6,1)],bonds:[[0,1],[0,2],[0,3],[0,4]]}}
const lobeTip=(M,k)=>{const L=M.lobes[k],A=M.atoms[L.i],sz=A.r*.8,d=A.r+sz*1.42;return [A.x+Math.cos(L.ang)*d,A.y+Math.sin(L.ang)*d]};
/* point at the surface of atom A toward (x,y) */
const edge=(A,x,y,pad)=>{const dx=x-A.x,dy=y-A.y,l=Math.hypot(dx,dy)||1,r=A.r+(pad||0);return [A.x+dx/l*r,A.y+dy/l*r]};
const uRect=(x,y,w,h,label,pad)=>({x,y,w,h,label,pad});

/* ---------- 1. brickBag (hook, slide 2): three snap-together brick models in a clear bag; shaking moves the models, never a brick ----------
   stages: models, shake, pour, words. The counter "Bricks snapped: 11 of 11" never changes. */
const SU=44,BH=70;
const MODELS=[{name:'yellow',cols:['#f2c230','#e3ae1d','#f7d460','#ebb92a'],b:[[0,0,4],[0,1,2],[2,1,2],[1,2,2]]},
  {name:'orange',cols:['#ec8a2e','#d9731a','#f4a65a','#e47f25'],b:[[1,0,2],[0,1,4],[1,2,2],[1,3,2]]},
  {name:'pink',cols:['#e46aa0','#cf4f88','#ef8fbb'],b:[[0,0,3],[1,1,3],[2,2,3]]}];
MODELS.forEach(M=>{M.w=Math.max(...M.b.map(([c,r,l])=>c+l))*SU;M.h=(Math.max(...M.b.map(([c,r])=>r))+1)*BH+16});
const NBRICKS=MODELS.reduce((a,M)=>a+M.b.length,0);
function drawModel(g,M,x,y,rot){const ctx=g.ctx;ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.translate(-M.w/2,M.h/2);
  M.b.forEach(([c,r,l],i)=>{const bx=c*SU,by=-(r+1)*BH,col=M.cols[i%M.cols.length],dk=D.mix(col,'#000000',.35);
    for(let k=0;k<l;k++)g.rrect(bx+k*SU+7,by-14,SU-14,18,4,D.mix(col,'#ffffff',.18),dk,3);
    g.rrect(bx,by,l*SU,BH,8,col,dk,3);g.line(bx+12,by+14,bx+l*SU-12,by+14,D.mix(col,'#ffffff',.35),5)});
  ctx.restore()}
function modelBox(M,x,y,rot){const c=Math.abs(Math.cos(rot)),s=Math.abs(Math.sin(rot)),w=M.w*c+M.h*s,h=M.w*s+M.h*c;return {x:x-w/2-10,y:y-h/2-10,w:w+20,h:h+20}}
/* a label "x = y" breaks before the "=" when it needs two lines */
function eqLines(g,txt,maxW,px){g.font(px,700);if(g.ctx.measureText(txt).width<=maxW)return [txt];const i=txt.indexOf(' = ');return i>0?[txt.slice(0,i),txt.slice(i+1)]:wrap(g,txt,maxW,px)}
D.sim('brickBag',function(host){
  const base={bag:1,table:0,lab:0,shake:0};
  const params={models:{...base},shake:{...base,shake:1},pour:{...base,bag:0,table:1},words:{...base,bag:0,table:1,lab:1}};
  /* bag: centre (cx, cy), size bw x bh; the models rest on its floor side by side, then tumble apart inside it (px from the centre) */
  const geo=(w,h)=>{const bw=Math.min(860,w*.6),bh=Math.min(h-56,470),cx=24+bw/2,cy=h/2+2,ty=h-30,fl=bh/2-24;
    const IN=[[-bw*.3,fl-MODELS[0].h/2,.03],[bw*.28,fl-MODELS[1].h/2,-.04],[-bw*.01,fl-MODELS[2].h/2,.05]];
    const SH=[[-bw*.31,bh*.06,-.26],[bw*.3,bh*.07,.24],[-bw*.01,-bh*.11,.3]];
    const tbl=[[w*.15,ty-MODELS[0].h/2,0],[w*.56,ty-MODELS[1].h/2,0],[w*.82,ty-MODELS[2].h/2,0]];
    return {bw,bh,cx,cy,ty,IN,SH,tbl,card:{x:bw+60,y:Math.max(16,cy-130),w:w-bw-84,h:260}}};
  function placed(p,I){const q=geo(I.w,I.h),t=I.live?I.clock:0;
    return MODELS.map((M,i)=>{const a=q.IN[i],b=q.SH[i];let x=q.cx+lerp(a[0],b[0],p.shake),y=q.cy+lerp(a[1],b[1],p.shake),r=lerp(a[2],b[2],p.shake);
      if(p.shake>.5&&I.live){x+=14*Math.sin(t*7+i*2);y+=12*Math.sin(t*9+i*1.3);r+=.12*Math.sin(t*5+i)}
      const T=q.tbl[i];return [lerp(x,T[0],p.table),lerp(y,T[1],p.table),lerp(r,T[2],p.table)]})}
  function bag(g,q,ang){const ctx=g.ctx;ctx.save();ctx.translate(q.cx,q.cy);ctx.rotate(ang);const w=q.bw,h=q.bh;
    ctx.beginPath();ctx.moveTo(-w/2,-h/2+30);ctx.lineTo(-w/2+10,h/2-26);ctx.quadraticCurveTo(-w/2+14,h/2,-w/2+44,h/2);ctx.lineTo(w/2-44,h/2);ctx.quadraticCurveTo(w/2-14,h/2,w/2-10,h/2-26);ctx.lineTo(w/2,-h/2+30);ctx.closePath();
    ctx.fillStyle=rgba(g.c('accent'),.07);ctx.fill();ctx.lineWidth=5;ctx.strokeStyle=g.c('muted');ctx.stroke();
    g.rrect(-w/2-6,-h/2+8,w+12,26,8,rgba(g.c('accent'),.18),g.c('muted'),4);g.line(-w/2+20,-h/2+21,w/2-20,-h/2+21,g.c('muted'),3,[10,8]);
    ctx.globalAlpha*=.5;g.line(-w/2+40,-h/2+70,-w/2+60,h/2-80,'#ffffff',8);ctx.restore()}
  const C1='Bricks snapped:',C2=NBRICKS+' of '+NBRICKS,COUNT=C1+' '+C2;
  const LAB1='a snap between bricks = a bond within',LAB2='models side by side = an attraction between';
  function labels(g,p,I,P,draw){const w=I.w,out=[];
    const a=P[0],l1=eqLines(g,LAB1,Math.min(560,w*.4),40),y1=Math.max(46,a[1]-MODELS[0].h/2-46-48*(l1.length-1));
    const b=P[1],c=P[2],gx=(b[0]+MODELS[1].w/2+c[0]-MODELS[2].w/2)/2,l2=eqLines(g,LAB2,Math.min(560,w*.4),40),y2=Math.max(46,Math.min(b[1]-MODELS[1].h/2,c[1]-MODELS[2].h/2)-46-48*(l2.length-1));
    const gx2=clamp(gx,0,w-20-Math.max(...l2.map(t=>{g.font(40,700);return g.ctx.measureText(t).width}))/2);
    if(draw)fade(g,p.lab,()=>{lines(g,l1,a[0],y1,40,48,{color:g.c('ink')});const sx=a[0]+SU*.6,sy=a[1]+MODELS[0].h/2-BH;
      g.line(a[0],y1+48*(l1.length-1)+30,sx,sy-10,g.c('accent'),5);g.circle(sx,sy,12,null,g.c('accent'),5);
      lines(g,l2,gx2,y2,40,48,{color:g.c('ink')});const yy=c[1]+MODELS[2].h/2-BH*1.1,x0=b[0]+MODELS[1].w/2+14,x1=c[0]-MODELS[2].w/2-14;
      dashGray(g,x0,yy,x1,yy,1);g.line(gx,y2+48*(l2.length-1)+30,gx,yy-14,g.c('accent'),5)});
    g.font(40,700);const w1=Math.max(...l1.map(t=>g.ctx.measureText(t).width)),w2=Math.max(...l2.map(t=>g.ctx.measureText(t).width));
    out.push(uRect(a[0]-w1/2-12,y1-30,w1+24,48*l1.length+12,'label: a bond within'),uRect(gx2-w2/2-12,y2-30,w2+24,48*l2.length+12,'label: an attraction between'));return out}
  function counter(g,p,I,draw){const q=geo(I.w,I.h),K=q.card,big=1-p.table;
    if(draw){fade(g,big,()=>{g.rrect(K.x,K.y,K.w,K.h,26,g.c('card'),g.c('line'),4);g.text(C1,K.x+K.w/2,K.y+80,44,{color:g.c('muted')});g.text(C2,K.x+K.w/2,K.y+168,80,{color:g.c('ink')})});
      fade(g,p.table,()=>g.text(COUNT,I.w-30,40,40,{align:'right',color:g.c('ink')}))}
    if(big>.5)return uRect(K.x,K.y,K.w,K.h,'counter');g.font(40,700);const cw=g.ctx.measureText(COUNT).width;return uRect(I.w-30-cw-14,10,cw+28,62,'counter')}
  return D.canvasSim(host,{stages:['models','shake','pour','words'],params,dur:{models:600,shake:800,pour:900,words:700},live:s=>s==='shake',
    draw(g,p,I){const q=geo(I.w,I.h),P=placed(p,I),ang=p.shake*(I.live?.06*Math.sin(I.clock*6):.04);
      fade(g,p.bag,()=>bag(g,q,ang));
      fade(g,p.table,()=>{g.rrect(24,q.ty,I.w-48,20,6,g.c('rope'),D.mix(g.c('rope'),'#000000',.4),3)});
      MODELS.forEach((M,i)=>drawModel(g,M,P[i][0],P[i][1],P[i][2]));
      counter(g,p,I,true);labels(g,p,I,P,true)},
    units:(p,I)=>{const q=geo(I.w,I.h),P=placed(p,{...I,live:false}),u=[],g=D.painter(document.createElement('canvas').getContext('2d'));
      if(p.table<.5)u.push(uRect(q.cx-q.bw/2-14,q.cy-q.bh/2-10,q.bw+28,q.bh+20,'the bag'));else{const mh=Math.max(...MODELS.map(M=>M.h));u.push(uRect(16,q.ty-mh-24,I.w-32,mh+56,'the table'))}
      MODELS.forEach((M,i)=>{const b=modelBox(M,...P[i]);u.push(uRect(b.x,b.y,b.w,b.h,M.name+' model'))});
      u.push(counter(g,p,I,false));if(p.lab>.5)u.push(...labels(g,p,I,P,false));return u},
    meta:(p,s)=>({stage:s,models:MODELS.length,bricks:NBRICKS,snapped:MODELS.reduce((a,M)=>a+M.b.length,0),counter:COUNT,
      labels:p.lab>.5?[LAB1,LAB2]:[],inBag:p.bag>.5,onTable:p.table>.5})});
});

/* ---------- 2. meltScale (launch, slide 3): snow, salt and sand, their particles and a melting-point scale ----------
   stages: three, melt, numbers. Scale −200 to 1800 °C (linear). Snow: water molecules in an open ring; salt: Na+ 102 pm and Cl- 181 pm
   at 282 pm spacing; sand: an Si-O network. melt: the snow's molecules leave their places, each whole; salt and sand stay. */
const MP=[{k:'snow',v:0.0,chip:'snow 0.0 °C'},{k:'salt',v:801,chip:'salt 801 °C'},{k:'sand',v:1700,chip:'sand near 1700 °C'}];
function snowman(g,x,y,s,slump){const ctx=g.ctx,ink=g.c('ink'),wh='#f6f8fa',st='#7f8c95';
  const k=1-slump;ctx.save();
  if(slump>.01){ctx.globalAlpha*=Math.min(1,slump*1.4);ctx.beginPath();ctx.ellipse(x,y+s*.95,s*.95*(.5+slump*.6),s*.16,0,0,TAU);ctx.fillStyle='#b9d7ea';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=st;ctx.stroke();ctx.globalAlpha=1}
  const r1=s*.45*(1-.25*slump),r2=s*.32*k,r3=s*.24*k,y1=y+s*.95-r1*(1-.45*slump);
  ctx.save();ctx.translate(x,y1);ctx.scale(1+.35*slump,1-.35*slump);g.circle(0,0,r1,wh,st,4);ctx.restore();
  if(k>.02){const y2=y1-r1-r2*.8,y3=y2-r2-r3*.8;g.circle(x,y2,r2,wh,st,4);g.circle(x,y3,r3,wh,st,4);

  function caption(g,I,txt,a,draw){if(!txt)return null;const L=wrap(g,txt,I.w-40,40),y=I.h-50-48*(L.length-1);if(draw)fade(g,a,()=>lines(g,L,I.w/2,y,40,48,{color:g.c('muted')}));

  const ext=(Ms,pad,lab)=>{let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;Ms.forEach(M=>{M.atoms.forEach(A=>{x0=Math.min(x0,A.x-A.r);x1=Math.max(x1,A.x+A.r);y0=Math.min(y0,A.y-A.r);y1=Math.max(y1,A.y+A.r)});

  /* ---- dispersion: two nonpolar molecules as electron clouds ---- */
  function disp(g,p,I,draw){const w=I.w,h=I.h,rx=Math.min(172,(w-70)/4),ry=Math.min(150,h*.22),cy=h*.4,c1=w/2-rx-24,c2=w/2+rx+24,t=I.live?I.clock:0,u=[];

      [-1,1].forEach(sd=>g.circle(cx+sd*rx*.42,cy,15,g.c('muted'),null));
      for(let j=0;j<10;j++){const a0=hash(j*7+(cx|0))*TAU,r0=.25+.6*hash(j*13+(cx|0)),drift=I.live?t*(.6+hash(j*3)*.7):0;
        let x=cx+Math.cos(a0+drift)*rx*r0*.9,y=cy+Math.sin(a0*1.3+drift*1.1)*ry*r0*.8;
        const sg=Math.sign(k)||1,ak=Math.abs(k);x=lerp(x,cx+sg*rx*(.3+.45*hash(j*5)),ak*.85);y=lerp(y,cy+(hash(j*9)-.5)*ry*.9,ak*.5);
        g.electron(x,y,13);g.line(x-7,y,x+7,y,g.c('on-ion'),4)}};
    if(draw){cloud(c1,k1);cloud(c2,k2);
      const a1=Math.abs(k1),a2=Math.abs(k2),sg=Math.sign(k1)||1,by=cy-ry-40;
      fade(g,a1,()=>{g.badge(c1+sg*rx*.72,by,sg>0?'δ−':'δ+',sg>0?g.c('dminus'):g.c('dplus'),32);g.badge(c1-sg*rx*.72,by,sg>0?'δ+':'δ−',sg>0?g.c('dplus'):g.c('dminus'),32)});
      fade(g,a2,()=>{g.badge(c2-sg*rx*.72,by,sg>0?'δ+':'δ−',sg>0?g.c('dplus'):g.c('dminus'),32);g.badge(c2+sg*rx*.72,by,sg>0?'δ−':'δ+',sg>0?g.c('dminus'):g.c('dplus'),32)});

    const st=AT_FAM[I.stage]==='dispersion'?I.stage:AT_FAM[I.from]==='dispersion'?I.from:'cloud',c=caption(g,I,CAP[st],1,draw);if(c)u.push(c);

  /* ---- dipole: F2 and HCl ---- */
  function dip(g,p,I,draw){const w=I.w,h=I.h,u=[],t=I.live?I.clock:0,sb=1,up=clamp(p.hcl+p.cmp,0,1);

    if(p.hcl>.5){const xs=[...h1.atoms,...h2.atoms],x0=Math.min(...xs.map(a=>a.x-a.r)),y0=Math.min(...xs.map(a=>a.y-a.r));
      u.push(uRect(x0-16,y0-84,Math.max(...xs.map(a=>a.x+a.r))-x0+32,Math.max(...xs.map(a=>a.y+a.r))-y0+100+(p.face>.5?64:0),'the HCl pair'))}

    else{const st=AT_FAM[I.stage]==='dipole'?I.stage:AT_FAM[I.from]==='dipole'?I.from:'F2',c=caption(g,I,CAP[st],1-p.cmp,draw);if(c)u.push(c)}
    return {u,facts:{family:'dipole',HCl:p.hcl>.5?{dplus:'H',dminus:'Cl'}:null,F2:p.f2>.5?{dplus:null,dminus:null,line:'dashed gray'}:null,headToTail:p.turn>.5,line:p.face>.5?'δ+ to δ−':null,
      label:p.face>.5?DD_LAB:null,electrons:p.cmp>.5?{F2:18,HCl:18}:null,bp:p.cmp>.5?{F2:-188.1,HCl:-85.1}:null}}}
  /* ---- hydrogen bonding: water, ammonia, methane, four ---- */
  const turnTo=(M,k,ang)=>{const L=M.lobes[k],O=M.atoms[L.i],da=ang-L.ang,c=Math.cos(da),s=Math.sin(da);M.atoms.forEach(A=>{const x=A.x-O.x,y2=A.y-O.y;A.x=O.x+x*c-y2*s;A.y=O.y+x*s+y2*c});M.lobes.forEach(Q=>{Q.ang+=da});return M};
  function hyd(g,p,I,draw){const w=I.w,h=I.h,u=[],y=h*.36,sb=1,yl=h-112;let facts={family:'hydrogen'};
    const labelAt=(txt,a)=>{const L=colonLines(g,txt,w-40,40);if(draw)fade(g,a,()=>lines(g,L,w/2,yl,40,50,{color:g.c('ink')}));g.font(40,700);
      const lw=Math.max(...L.map(t=>g.ctx.measureText(t).width));return uRect(w/2-lw/2-14,yl-32,lw+28,50*L.length+14,'label: '+txt)};

/* ---------- 5. bpPlot (slides 7 and 9): boiling point against electrons per molecule ----------
   stages: axes, F2, Cl2, Br2, I2, trend, trio, reveal, HCl. Values: lessons/4-5.md (the reading's data). */
const BP=[{k:'F2',f:'F_2',e:18,bp:-188.1,force:'dispersion forces'},{k:'Cl2',f:'Cl_2',e:34,bp:-34.0,force:'dispersion forces'},{k:'Br2',f:'Br_2',e:70,bp:58.8,force:'dispersion forces'},
  {k:'I2',f:'I_2',e:106,bp:184.4,force:'dispersion forces'},{k:'CH4',f:'CH_4',e:10,bp:-161.5,force:'dispersion forces'},{k:'NH3',f:'NH_3',e:10,bp:-33.3,force:'hydrogen bonding'},
  {k:'H2O',f:'H_2O',e:10,bp:100.0,force:'hydrogen bonding'},{k:'HCl',f:'HCl',e:18,bp:-85.1,force:'dipole-dipole forces'}];
const TREND=['more electrons,','higher boiling point'];
const fmtBp=v=>(v<0?'−':'')+Math.abs(v).toFixed(1)+' °C';
D.sim('bpPlot',function(host){
  const st=['axes','F2','Cl2','Br2','I2','trend','trio','reveal','HCl'],params={};
  /* per point: a (point alpha), l (label alpha); halogens fade behind the trio stages */
  st.forEach((s,i)=>{const o={trend:0};BP.forEach(q=>{o[q.k]=0;o[q.k+'l']=0});
    ['F2','Cl2','Br2','I2'].forEach((k,j)=>{if(i>=j+1&&i<=5){o[k]=1;o[k+'l']=1}else if(i>5){o[k]=.25;o[k+'l']=0}});
    if(i>=5&&i<=5)o.trend=1;if(i>5)o.trend=0;
    if(i>=6){['CH4','NH3','H2O'].forEach(k=>{o[k]=i===8?.25:1;o[k+'l']=i===7?1:0})}
    if(i===8){o.F2=1;o.F2l=1;o.HCl=1;o.HCll=1}params[s]=o});
  const lay=(w,h)=>{const L=120,R=36,T=86,B=118,X=e=>L+e/110*(w-L-R),Y=v=>T+(200-v)/400*(h-T-B);return {L,R,T,B,X,Y}};
  const labelSide={F2:1,Cl2:1,Br2:-1,I2:-1,CH4:1,NH3:1,H2O:1,HCl:1},labelDy={F2:-30};
  function pt(g,q,a,la,P,draw){const x=P.X(q.e),y=P.Y(q.bp),s=labelSide[q.k],txt=q.f+'  '+fmtBp(q.bp),tw=chemW(g,txt,36);
    if(draw)fade(g,a,()=>{g.circle(x,y,16,g.c('accent'),g.c('ink'),3); /* one marker color: warm and teal stay reserved for δ+ and δ− */
      fade(g,la,()=>g.chem(txt,x+s*28,y+(labelDy[q.k]||0),36,{align:s>0?'left':'right',halo:8,color:g.c('ink')}))});
    /* the unit is at least 260 px wide, so it fills 60% of the slide at the 4x zoom cap */
    const dy=labelDy[q.k]||0,uw=Math.max(tw+62,260),ux=(s>0?x-24:x-28-tw-10)-(uw-tw-62)*(s>0?0:1);return uRect(ux,Math.min(y,y+dy)-34,uw,68+Math.abs(dy),q.f.replace('_','')+' point')}
  return D.canvasSim(host,{stages:st,params,dur:700,
    draw(g,p,I){const P=lay(I.w,I.h),ink=g.c('ink'),mu=g.c('muted'),ctx=g.ctx;
      /* axes */
      g.line(P.L,P.T-10,P.L,I.h-P.B,ink,4);g.line(P.L,I.h-P.B,I.w-P.R,I.h-P.B,ink,4);
      for(let v=-200;v<=200;v+=100){const y=P.Y(v);g.line(P.L-10,y,P.L,y,ink,4);if(v>-200)g.line(P.L,y,I.w-P.R,y,rgba(mu,.25),2);g.text((v<0?'−':'')+Math.abs(v),P.L-16,y,36,{align:'right',mono:true,wt:600,color:mu})}
      for(let e=0;e<=100;e+=20){const x=P.X(e);g.line(x,I.h-P.B,x,I.h-P.B+10,ink,4);g.text(String(e),x,I.h-P.B+34,36,{mono:true,wt:600,color:mu})}
      g.text('Boiling point (°C)',P.L-110,40,36,{align:'left',color:mu});g.text('Electrons per molecule',(P.L+I.w-P.R)/2,I.h-30,36,{color:mu});

    units:(p,I)=>{const P=lay(I.w,I.h),g=D.painter(document.createElement('canvas').getContext('2d')),u=[uRect(P.L-120,10,I.w-P.L+110,I.h-20,'the axes')];
      BP.forEach(q=>{if(p[q.k]>.5&&p[q.k+'l']>.5)u.push(pt(g,q,1,1,P,false))});
      if(p.trend>.5){g.font(36,700);const tw=Math.max(...TREND.map(t=>g.ctx.measureText(t).width));u.push(uRect(P.L+12,P.Y(170)-30,tw+24,106,'trend caption'))}return u},
    meta:(p,s)=>({stage:s,points:BP.filter(q=>p[q.k]>.01).map(q=>({f:uni(q.f),e:q.e,bp:q.bp,force:q.force,faint:p[q.k]<.5,labelled:p[q.k+'l']>.5})),trend:p.trend>.5,

/* ---------- 6. forceDecider (DOM, slide 10): the three questions of the reading's triplet 1 as four boxes filling one per press ----------
   stages: NH3/polar, NH3/H, NH3/lone, NH3/strongest, CO2/polar, CO2/H, CO2/strongest, HBr/EN, HBr/polar, HBr/H, HBr/strongest.
   Beside the boxes: the molecule (SVG, CPK, δ labels where polar) and, for HBr, the electronegativity label line and chips. */
const FD_BOX=[{k:'polar',t:'Polar?'},{k:'H',t:'H on N, O or F?'},{k:'lone',t:'Lone pair on N, O or F?'},{k:'strongest',t:'Strongest attraction'}];
const FD={NH3:{name:'ammonia, NH<sub>3</sub>',ans:{polar:'yes',H:'yes',lone:'yes',strongest:'hydrogen bonding'},
    txt:{polar:'Yes. It is trigonal pyramidal (Lesson 4.4).',H:'Yes. H is on N.',lone:'Yes. N has a lone pair.',strongest:'Hydrogen bonding.'},
    steps:[['polar'],['H'],['lone'],['strongest']]},
  CO2:{name:'carbon dioxide, CO<sub>2</sub>',ans:{polar:'no',H:'no',lone:'not needed',strongest:'dispersion forces'},
    txt:{polar:'No. It is linear, so the pulls&nbsp;cancel.',H:'No. CO<sub>2</sub> has no H.',lone:'Not needed.',strongest:'Dispersion forces.'},
    steps:[['polar'],['H','lone'],['strongest']]},
  HBr:{name:'hydrogen bromide, HBr',ans:{polar:'yes',H:'no',lone:'not needed',strongest:'dipole-dipole forces'},
    txt:{polar:'Yes. The difference is&nbsp;0.76.',H:'No. H is on Br, not N, O or&nbsp;F.',lone:'Not needed.',strongest:'Dipole-dipole forces.'},
    steps:[[],['polar'],['H','lone'],['strongest']]}};
const FD_STAGES={'NH3/polar':['NH3',0],'NH3/H':['NH3',1],'NH3/lone':['NH3',2],'NH3/strongest':['NH3',3],'CO2/polar':['CO2',0],'CO2/H':['CO2',1],'CO2/strongest':['CO2',2],
  'HBr/EN':['HBr',0],'HBr/polar':['HBr',1],'HBr/H':['HBr',2],'HBr/strongest':['HBr',3]};
/* molecule drawings (SVG, 400 x 300 px): CPK spheres with the symbol, gray sticks, δ labels where polar, a lone pair lobe on N */
function fdSvg(m){const S=[],at=(x,y,r,s)=>{const c=CPK[s],ink=D.lum(c)>.3?'#10201c':'#ffffff';
    S.push(`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}" stroke="${D.mix(c,'#000000',.5)}" stroke-width="3"/><text x="${x}" y="${y+14}" font-size="40" font-weight="700" text-anchor="middle" fill="${ink}">${s}</text>`)},
  st=(x0,y0,x1,y1)=>S.push(`<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="${STICK2}" stroke-width="20" stroke-linecap="round"/><line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="${STICK}" stroke-width="14" stroke-linecap="round"/>`),
  dl=(x,y,t,plus)=>S.push(`<g class="fd-d"><circle cx="${x}" cy="${y}" r="30" fill="var(${plus?'--dplus':'--dminus'})"/><text x="${x}" y="${y+13}" font-size="36" font-weight="700" text-anchor="middle" fill="var(--on-ion)">${t}</text></g>`);
  if(m==='NH3'){S.push(`<ellipse cx="200" cy="58" rx="40" ry="26" fill="var(--e)" fill-opacity=".3" stroke="var(--e)" stroke-width="3"/><circle cx="188" cy="58" r="8" fill="var(--e)"/><circle cx="212" cy="58" r="8" fill="var(--e)"/>`);
    st(200,135,104,196);st(200,135,296,196);st(200,135,226,232);at(104,196,30,'H');at(296,196,30,'H');at(200,135,47,'N');at(226,232,30,'H');
    dl(292,74,'δ−',0);dl(42,250,'δ+',1);dl(358,250,'δ+',1)}
  if(m==='CO2'){st(70,150,330,150);at(70,150,45,'O');at(330,150,45,'O');at(200,150,49,'C')}
  if(m==='HBr'){st(110,160,290,160);at(110,160,30,'H');at(290,160,68,'Br');dl(110,92,'δ+',1);dl(290,56,'δ−',0)}
  return `<svg width="400" height="300" viewBox="0 0 400 300" role="img" aria-label="${m} molecule">${S.join('')}</svg>`}
D.sim('forceDecider',function(host){
  const wrapEl=document.createElement('div');wrapEl.style.cssText='display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:22px;height:100%;min-height:0';
  const grid=document.createElement('div');grid.className='cer-grid';grid.style.minHeight='0';
  const side=document.createElement('div');side.style.cssText='display:flex;flex-direction:column;gap:14px;min-height:0;align-items:center;justify-content:center';
  const boxes={};
  FD_BOX.forEach(B=>{const b=document.createElement('div');b.className='cer-box';b.innerHTML='<h3>'+B.t+'</h3><div class="cer-body"></div>';
    Object.keys(FD).forEach(m=>{const q=document.createElement('p');q.dataset.m=m;q.innerHTML=FD[m].txt[B.k];if(FD[m].ans[B.k]==='not needed')q.style.color='var(--muted)';b.lastChild.appendChild(q)});
    grid.appendChild(b);boxes[B.k]=b});
  const draw=document.createElement('div');draw.className='fd-mol';draw.style.cssText='display:grid;justify-items:center;gap:6px';
  /* the other molecules' pictures are hidden (the hidden attribute), so no audit reads their text */
  const pics={};Object.keys(FD).forEach(m=>{const d=document.createElement('div');d.dataset.m=m;d.hidden=true;d.style.textAlign='center';
    d.innerHTML=fdSvg(m)+'<p style="margin:0;font-size:40px;font-weight:700">'+FD[m].name+'</p>';draw.appendChild(d);pics[m]=d});
  const chips=document.createElement('div');chips.className='fd-en';chips.style.cssText='visibility:hidden;font-size:40px';
  chips.innerHTML='<span class="enrow"><span class="enl lbl">Electronegativity (pull on electrons)</span><span class="chips"><span class="chip"><b>Br</b><span class="mono">2.96</span></span><span class="chip"><b>H</b><span class="mono">2.20</span></span><span class="chip"><b>difference</b><span class="mono">0.76</span></span></span></span>';
  side.appendChild(draw);side.appendChild(chips);wrapEl.appendChild(grid);wrapEl.appendChild(side);host.appendChild(wrapEl);host.classList.add('cer');
  const stages=Object.keys(FD_STAGES);let stage=stages[0];
  const filled=s=>{const [m,i]=FD_STAGES[s];return {m,i,keys:FD[m].steps.slice(0,i+1).flat(),now:FD[m].steps[i].length?FD[m].steps[i][0]:'polar'}};
  return {stages,
    set(s,instant){if(!FD_STAGES[s]){console.error('Deck: '+host.id+' has no stage "'+s+'"');return}stage=s;const F=filled(s);
      if(instant||D.reduced())host.classList.add('instant');
      FD_BOX.forEach(B=>{const b=boxes[B.k],on=F.keys.includes(B.k);[...b.lastChild.children].forEach(q=>q.classList.toggle('on',on&&q.dataset.m===F.m));
        b.classList.toggle('now',B.k===F.now);b.classList.toggle('full',on)});
      Object.keys(pics).forEach(m=>{pics[m].hidden=m!==F.m});chips.style.visibility=F.m==='HBr'?'visible':'hidden';
      if(host.classList.contains('instant')){void host.offsetWidth;requestAnimationFrame(()=>requestAnimationFrame(()=>host.classList.remove('instant')))}},
    get:()=>stage,bounds:()=>({x:0,y:0,w:host.clientWidth,h:host.clientHeight}),resize(){},redraw(){},active(){},minFont:Infinity,
    units:()=>FD_BOX.map(B=>({el:boxes[B.k],label:B.t})).concat([{el:draw,label:'the molecule'},{el:chips,label:'electronegativity'}]),
    meta(){const F=filled(stage),A={};FD_BOX.forEach(B=>{A[B.k]=F.keys.includes(B.k)?FD[F.m].ans[B.k]:null});
      return {stage,molecule:F.m,answers:A,en:F.m==='HBr'?{label:'Electronegativity (pull on electrons)',Br:2.96,H:2.20,difference:0.76}:null,boxes:FD_BOX.map(B=>B.t)}}};
});
})();
</script>
