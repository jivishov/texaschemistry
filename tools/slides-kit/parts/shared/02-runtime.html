<body>
<script>
/* ===== Deck runtime (plan section 3). Written once, copied into each Unit 4 deck. =====
   A slide declares its frames with Deck.frames(slideId, [state, ...]). A state is declarative:
     show:['id'|group]  hide:[...]  stage:'simId:stage' or [...]  cls:{elementId:'classes'}
     timer:seconds  zoom:'id'  focus:'id'  label:'what this frame reveals'  cue:'override for this frame'
     note:'teacher note (HTML)'  t:minutes
   Frame n is computed by replaying states 0..n, so Back never needs a reverse action.
   An animation registers with Deck.sim(name, factory(host, Deck)) and returns
     {stages:[...], set(stage, instant), get(), bounds(), resize(), redraw(), active(on)} (+ optional meta() for tests).
   bounds() is the rect the animation draws, in host px; zoom fits it (up to 4x). Optional units(): sub-units of the current stage,
   [{x,y,w,h,label}] rects in host px or [{el,label}] elements, each its own step of the zoom cycle.
   Zoom cycle: the Blank key zooms the slide's visible units one per press (animation first, then top-left to bottom-right),
   and the press after the last unit unzooms. Units: [data-zoom], cards, check rows, lines, steps, table rows, summary columns, ...
   Accumulating columns (.acc): hidden cards take no space; earlier cards get .adone, and compact to their tag line (.cmp, the body
   hidden, nothing truncated) only when the column overflows, earliest first; a lone card gets .lone (48 px).
   Text units zoom by re-flow: a clone in an overlay, scaled up to 2.2x to fit the slide with 60 px margins, lines re-wrapped;
   animations, their parts and table columns keep the transform zoom.  */
(function(){
'use strict';
const W=1600,H=900,RM=matchMedia('(prefers-reduced-motion: reduce)');
const D=window.Deck={types:{},defs:{},sims:{},slides:[],cur:{s:-1,f:0}};
D.sim=(name,factory)=>{D.types[name]=factory};
D.frames=(id,frames)=>{D.defs[id]=frames};
D.reduced=()=>RM.matches;
const $=(s,r)=>(r||document).querySelector(s), $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const arr=x=>x==null?[]:Array.isArray(x)?x:[x];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const ZMAX=4;

/* ---------- model ---------- */
function norm(fr){
  fr=fr||{};
  const stage=arr(fr.stage).map(x=>{if(typeof x!=='string')return x;const i=x.lastIndexOf(':');return {sim:x.slice(0,i),s:x.slice(i+1)}});
  return {show:arr(fr.show),hide:arr(fr.hide),stage,cls:fr.cls||{},timer:fr.timer||0,zoom:fr.zoom||null,focus:fr.focus||null,cue:fr.cue,label:fr.label,note:fr.note||'',t:fr.t};
}
function find(el,name){return $$('[id="'+name+'"],[data-b="'+name+'"]',el)}
function build(el,i){
  const frames=(D.defs[el.id]||[{}]).map(norm), blocks=new Map(), init=new Map(), clsIds=new Set();
  frames.forEach(fr=>{
    fr.hide.forEach(n=>{if(!blocks.has(n)){blocks.set(n,find(el,n));init.set(n,true)}});
    fr.show.forEach(n=>{if(!blocks.has(n)){blocks.set(n,find(el,n));init.set(n,false)}});
    Object.keys(fr.cls).forEach(id=>clsIds.add(id));
  });
  blocks.forEach((els,n)=>{if(!els.length)console.error('Deck: block "'+n+'" not found on slide '+el.id);els.forEach(e=>e.classList.add('blk'))});
  clsIds.forEach(id=>{if(!document.getElementById(id))console.error('Deck: cls target "'+id+'" not found on slide '+el.id)});
  const h=$('h2',el);
  return {period:el.dataset.period||'',el,i,id:el.id,title:el.dataset.title||(h?h.textContent.trim():el.id),sec:el.dataset.sec||'',ref:el.dataset.ref||'',
    frames,blocks,init,clsIds:[...clsIds],sims:$$('.sim[data-sim]',el).map(x=>D.sims[x.id]).filter(Boolean),notes:$('.notes',el)};
}
function compute(S,f){
  const vis=new Map(S.init),stg={},cls={};
  for(let i=0;i<=f;i++){const fr=S.frames[i];fr.hide.forEach(n=>vis.set(n,false));fr.show.forEach(n=>vis.set(n,true));fr.stage.forEach(x=>{stg[x.sim]=x.s});Object.assign(cls,fr.cls)}
  return {vis,stg,cls};
}
function apply(S,st,fr,anim){
  st.vis.forEach((v,n)=>S.blocks.get(n).forEach(e=>{
    e.classList.toggle('on',v);e.classList.remove('fx');
    if(v&&anim&&fr.show.includes(n)){void e.getBoundingClientRect();e.classList.add('fx')}
  }));
  S.clsIds.forEach(id=>{const e=document.getElementById(id);if(!e)return;(e._dc||[]).forEach(c=>e.classList.remove(c));
    const v=String(st.cls[id]||'').split(/\s+/).filter(Boolean);v.forEach(c=>e.classList.add(c));e._dc=v});
}

/* ---------- frame engine ---------- */
function go(s,f,o){
  o=o||{};
  if(!D.slides.length)return;
  s=Math.max(0,Math.min(D.slides.length-1,s|0));
  const S=D.slides[s],nf=S.frames.length;
  f=f<0?nf-1:Math.max(0,Math.min(nf-1,f|0));
  const P=D.slides[D.cur.s],changed=P!==S,step=!changed&&o.dir===1&&f===D.cur.f+1,anim=step&&!RM.matches;
  const kept=zoom&&zoom.manual&&!changed&&!zoom.u.rect&&D.sims[zoom.el.id]?zoom.el:null;
  unzoom();stopTimer();if(P)clearMarks(P.el);
  if(changed){if(P){P.el.classList.remove('current');P.sims.forEach(x=>x.active(false))}S.el.classList.add('current')}
  const fr=S.frames[f],st=compute(S,f);
  apply(S,st,fr,anim);clearMarks(S.el);fitLayout(S);
  if(changed)S.sims.forEach(x=>x.active(true));else S.sims.forEach(x=>x.resize());
  S.sims.forEach(x=>{const t=st.stg[x.id]!==undefined?st.stg[x.id]:x.stages[0];x.set(t,!(anim&&fr.stage.some(y=>y.sim===x.id)))});
  D.cur={s,f};
  if(fr.timer)startTimer(fr.timer,S);
  if(fr.zoom)zoomTo({el:lift(blockEl(S,fr.zoom))},false);
  else if(kept&&fr.stage.some(x=>x.sim===kept.id))zoomTo({el:kept,kind:'animation'},true); /* zoomed on an animation: stay on it while the frames drive it */
  chrome();notesRender();
  try{history.replaceState(null,'','#'+(s+1)+'.'+f)}catch(e){}
}
function next(){const S=D.slides[D.cur.s];if(D.cur.f<S.frames.length-1)go(D.cur.s,D.cur.f+1,{dir:1});else if(D.cur.s<D.slides.length-1)go(D.cur.s+1,0,{dir:1})}
function prev(){if(D.cur.f>0)go(D.cur.s,D.cur.f-1,{dir:-1});else if(D.cur.s>0)go(D.cur.s-1,-1,{dir:-1})}
D.go=go;D.next=next;D.prev=prev;

function frameLabel(S,fr){
  if(fr.label)return fr.label;
  for(const n of fr.show){const e=(S.blocks.get(n)||[])[0];if(e&&e.dataset.label)return e.dataset.label}
  if(fr.timer)return 'timer '+fmt(fr.timer);
  if(fr.stage.length)return fr.stage[fr.stage.length-1].s;
  return 'next step';
}
function cueText(S,f){
  const fr=S.frames[f];
  if(fr.cue)return 'Next ▶ '+fr.cue;
  if(f+1<S.frames.length)return 'Next ▶ '+frameLabel(S,S.frames[f+1]);
  if(S.i+1<D.slides.length){const N=D.slides[S.i+1];return 'Next ▶ slide '+(N.i+1)+': '+N.title}
  return 'End of the deck';
}
function zoomCue(){
  if(!cyc||cyc.i<0)return 'Zoom · Blank ▶ next · Back ▶ exit';
  return 'Zoom '+(cyc.i+1)+' of '+cyc.U.length+' · Blank ▶ '+(cyc.i+1<cyc.U.length?'next':'exit')+' · Back ▶ exit';
}
function chrome(){
  const S=D.slides[D.cur.s],f=D.cur.f;
  $('#count').textContent=(S.i+1)+' / '+D.slides.length;
  $('#sec').textContent=[S.sec,S.ref].filter(Boolean).join(' · ');
  $('#cue').textContent=zoom?zoomCue():cueText(S,f);
  $('#prog i').style.width=((S.i+(f+1)/S.frames.length)/D.slides.length*100)+'%';
}

/* ---------- timer: 96 px digits in the slide's .timer slot (a layout element, so it never covers content); restarts whenever its frame is entered ---------- */
const mfmt=m=>String(Math.round(m*100)/100);
function fmt(sec){sec=Math.max(0,Math.ceil(sec));return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')}
function startTimer(sec,S){
  const el=$('.timer',S.el);
  if(!el){console.error('Deck: slide '+S.id+' has a timed frame but no .timer slot');return}
  if(!$('.d',el))el.innerHTML='<span class="d"></span><span class="tb"><i></i></span>';
  const d=$('.d',el),bar=$('.tb i',el),t0=performance.now(),dur=sec*1000;
  el.classList.add('run');el.classList.remove('end');
  const tick=()=>{const left=Math.max(0,dur-(performance.now()-t0));d.textContent=fmt(left/1000);bar.style.width=(left/dur*100)+'%';
    if(left<=0){el.classList.add('end');clearInterval(timer.iv)}};
  timer={el,sec,iv:setInterval(tick,200)};tick();
}
function stopTimer(){if(timer){clearInterval(timer.iv);timer.el.classList.remove('run','end');timer=null}}

/* ---------- zoom: transform the focus block to fill the slide, up to 3x ---------- */
function blockEl(S,name){const b=S.blocks.get(name);return b&&b[0]?b[0]:(document.getElementById(name)||null)}
function lift(e){
  if(!e)return e;
  if(e instanceof SVGElement){while(e.ownerSVGElement)e=e.ownerSVGElement}
  const t=e.closest&&e.closest('table');if(t)e=t;
  return e;
}
function focusEl(){
  const S=D.slides[D.cur.s],fr=S.frames[D.cur.f];let e=null;
  if(fr.focus)e=blockEl(S,fr.focus);
  for(let i=fr.show.length-1;!e&&i>=0;i--)e=blockEl(S,fr.show[i]);
  if(!e&&fr.stage.length)e=document.getElementById(fr.stage[fr.stage.length-1].sim);
  if(!e)e=$('[data-focus]',S.el)||$('.sim',S.el)||$('.body',S.el);
  return lift(e);
}
/* zoom geometry is read live and at rest: the stage scale is measured from the stage itself (never a k cached before a
   resize or a full-screen change), and an in-flight zoom transition (.35 s) or block reveal (.25 s) is finished first, since
   a box measured half way through its transition puts the next zoom off centre (stepping the cycle on one animation,
   Next while zoomed, a press during the zoom-out). settle() keeps each finished element's in-flight transform so zoomTo
   can start its own transition from where the element visibly was. */
const liveK=()=>{const r=$('#stage').getBoundingClientRect().width/W;return r>0?r:k};
let zfrom=null;
function settle(){
  const S=D.slides[D.cur.s];if(!S||!S.el.getAnimations)return;
  S.el.getAnimations({subtree:true}).forEach(a=>{const e=a.effect&&a.effect.target;if(!e)return;
    if(a.transitionProperty==='transform'){if(!zfrom){zfrom=new Map();queueMicrotask(()=>{zfrom=null})}if(!zfrom.has(e))zfrom.set(e,getComputedStyle(e).transform);a.finish()}
    else if(a.animationName==='fadeUp')a.finish()});
}
/* the zoomed element measured without its zoom transform (no visible change: nothing paints in between) */
function unzoomed(fn){
  const z=zoom&&!zoom.reflow?zoom.el:null;if(!z)return fn();
  const t=z.style.transform,tr=z.style.transition,c=z.style.clipPath;z.style.transition='none';z.style.transform='none';z.style.clipPath='';
  try{return fn()}finally{z.style.transform=t;z.style.clipPath=c;void getComputedStyle(z).transform;z.style.transition=tr}
}
/* zoom units (every piece of information on the slide), in cycle order: animations first with their sub-units, then top-left to bottom-right */
const UNIT_SEL='[data-zoom],.card,.checkrow,.line,.hdr,.caprow,.rulerow>p,.steps>li,.item,.wcard,.legend,.frames,.bank,.rate>li,.steprows>li,.scale,.handsup,.phase,.r800,.rail,.body>p,.tbl,.g3';
function visEl(e){if(!e||!e.getClientRects().length)return false;const cs=getComputedStyle(e);if(cs.visibility!=='visible'||parseFloat(cs.opacity)<.05)return false;const r=e.getBoundingClientRect();return r.width>8&&r.height>8}
function hasContent(e){const w=document.createTreeWalker(e,NodeFilter.SHOW_TEXT);let n;
  while((n=w.nextNode())){if(n.nodeValue.trim()&&getComputedStyle(n.parentElement).visibility==='visible'&&!n.parentElement.closest('.timer'))return true}
  return $$('svg,canvas',e).some(x=>getComputedStyle(x).visibility==='visible'&&x.getBoundingClientRect().width>8)}
/* the rect a unit's information actually covers (text, pictures, options, chips), padded: a wide card with a short line zooms to the line */
function contentRect(el){const R=[],w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let n;
  while((n=w.nextNode())){if(!n.nodeValue.trim()||getComputedStyle(n.parentElement).visibility!=='visible')continue;const rg=document.createRange();rg.selectNodeContents(n);for(const r of rg.getClientRects())if(r.width>0)R.push(r)}
  $$('svg,canvas,img,.opt,.chip,.gap,.bank span',el).forEach(x=>{if(visEl(x))R.push(x.getBoundingClientRect())});
  if(!R.length)return null;const a=el.getBoundingClientRect(),p=22*liveK();
  return {left:Math.max(a.left,Math.min(...R.map(r=>r.left))-p),top:Math.max(a.top,Math.min(...R.map(r=>r.top))-p),right:Math.min(a.right,Math.max(...R.map(r=>r.right))+p),bottom:Math.min(a.bottom,Math.max(...R.map(r=>r.bottom))+p)}}
function kindOf(e){return e.dataset.zoom||(e.matches('.check,.checkrow')?'check':e.matches('.rule')?'rule':e.matches('.prompt,.dq')?'prompt':e.matches('.card')?'card':
  (['line','hdr','caprow','item','wcard','legend','frames','bank','scale','handsup','phase','r800','rail'].find(c=>e.classList.contains(c))||e.tagName.toLowerCase()))}
function zoomUnits(){
  const S=D.slides[D.cur.s];if(!S||flow)return [];
  settle();return unzoomed(()=>unitsAtRest(S));
}
function unitsAtRest(S){
  const k=liveK(),sr=S.el.getBoundingClientRect(),out=[],rest=[];
  const loc=(el,r)=>{const a=el.getBoundingClientRect();return {x:(r.left-a.left)/k,y:(r.top-a.top)/k,w:(r.right-r.left)/k,h:(r.bottom-r.top)/k}};
  S.sims.forEach(x=>{const h=x.host;if(!visEl(h)||!(x.bounds&&x.bounds()))return;out.push({el:h,kind:'animation',label:h.dataset.sim});
    ((x.units&&x.units())||[]).forEach(u=>{if(u.el){if(visEl(u.el)&&hasContent(u.el))out.push({el:u.el,kind:'part',label:u.label||''})}
      else if(u.w>8&&u.h>8)out.push({el:h,rect:u.pad!=null?{x:u.x,y:u.y,w:u.w,h:u.h,pad:u.pad}:{x:u.x,y:u.y,w:u.w,h:u.h},kind:'part',label:u.label||''})})});
  const cand=$$(UNIT_SEL,S.el).filter(e=>!e.closest('.sim,.notes,.timer')&&!e.matches('.tag')&&e.dataset.zoom!=='none'&&visEl(e)&&hasContent(e));
  cand.filter(e=>!cand.some(o=>o!==e&&o.contains(e))).forEach(e=>{
    if(e.matches('.tbl')&&!e.dataset.zoom){$$('tbody tr',e).forEach(tr=>{if(visEl(tr)&&hasContent(tr)){const r=tr.getBoundingClientRect(),c=contentRect(tr)||r;rest.push({el:e,rect:loc(e,c),row:tr,kind:'row',pos:r})}});return}
    if(e.matches('.g3')){const kids=[...e.children];if(![1,2,3].some(c=>kids.some((x,i)=>i%4===c&&hasContent(x)))){rest.push({el:e,kind:'table',pos:e.getBoundingClientRect()});return}
      for(let c=1;c<=3;c++){const cells=kids.filter((x,i)=>i%4===c&&hasContent(x));if(!cells.length)continue;
      const rs=cells.map(x=>x.getBoundingClientRect()),r={left:Math.min(...rs.map(q=>q.left)),top:Math.min(...rs.map(q=>q.top)),right:Math.max(...rs.map(q=>q.right)),bottom:Math.max(...rs.map(q=>q.bottom))};
      rest.push({el:e,rect:loc(e,r),kind:'column',pos:r})}return}
    /* a unit zooms to the part its information covers (a card stretched to fill its column, a wide card with a short line);
       a compacted card zooms whole, since it opens up in full while zoomed */
    if(!e.classList.contains('cmp')){const a=e.getBoundingClientRect(),c=contentRect(e);
      if(c&&(c.right-c.left)*(c.bottom-c.top)<.85*a.width*a.height){rest.push({el:e,rect:loc(e,c),kind:kindOf(e),pos:a});return}}
    rest.push({el:e,kind:kindOf(e),pos:e.getBoundingClientRect()})});
  rest.sort((a,b)=>Math.round((a.pos.top-sr.top)/k/40)-Math.round((b.pos.top-sr.top)/k/40)||a.pos.left-b.pos.left);
  return out.concat(rest.map(u=>({el:u.el,rect:u.rect,row:u.row,kind:u.kind,label:u.label||u.el.dataset.label||''})));

const sameUnit=(a,b)=>a&&b&&a.el===b.el&&a.row===b.row&&(!a.rect&&!b.rect||a.rect&&b.rect&&Math.abs(a.rect.x-b.rect.x)<2&&Math.abs(a.rect.y-b.rect.y)<2);
/* re-flow zoom: a text unit is cloned into an overlay, inside shallow copies of its ancestors (so every style that depends on them
   still applies, their own layout neutralized), and scaled (CSS zoom) to the largest size up to 2.2x that fits the slide with
   60 px margins; the clone's lines re-wrap at the wider measure; options and chips keep their layout */
const isReflow=u=>u.kind!=='animation'&&u.kind!=='part'&&u.kind!=='column'&&!u.el.closest('.sim')&&!u.el.matches('.g3');
function cleanClone(n){n.removeAttribute('id');n.classList.remove('adone','cmp','act','lone','zoomable','zoomed','fx','fill');$$('[id]',n).forEach(x=>x.removeAttribute('id'));
  $$('.fx',n).forEach(x=>x.classList.remove('fx'));n.style.transform='';n.style.clipPath='';n.style.position='';return n}
function zoomReflow(u,S){
  const src=u.row||u.el,k=liveK(),sr=S.el.getBoundingClientRect(),SW=sr.width/k,SH=sr.height/k,M=60;
  const node=src.cloneNode(true);
  /* what is hidden on the slide (an answer not yet revealed, an empty feedback line) takes no room in the clone */
  /* (a table row keeps its empty answer slot, as on the slide) */

  cleanClone(node);let outer=node;
  for(let a=src.parentElement;a&&a!==S.el;a=a.parentElement){const w=cleanClone(a.cloneNode(false));const tbl=/^(TABLE|TBODY|THEAD|TR)$/.test(w.tagName);
    w.style.cssText='position:static;width:auto;height:auto;min-height:0;max-width:none;margin:0;padding:0;border:0;background:none;box-shadow:none;transform:none;overflow:visible;visibility:visible;opacity:1;list-style:none;'+(tbl?'':'display:block;');
    w.appendChild(outer);outer=w}

  node.style.cssText+=';box-sizing:border-box;margin:0;height:auto;min-height:0;flex:none;'+(node.tagName==='TR'?'':'width:max-content;');
  const fits=z=>{outer.style.zoom=z;node.style.maxWidth=((SW-2*M)/z).toFixed(1)+'px';const r=node.getBoundingClientRect();

  let lo=1,hi=2.2;if(fits(hi))lo=hi;else{for(let i=0;i<9;i++){const m=(lo+hi)/2;if(fits(m))lo=m;else hi=m}}fits(lo);

function zoomTo(u,manual){

  clearZoom();

  else cyc.i=cyc.U.findIndex(x=>sameUnit(x,u));

  if(isReflow(u)){const f=zoomReflow(u,S);S.el.classList.add('zooming');zoom={el,z:f.z,manual,u,ov:f.ov,node:f.node,rect:f.rect,sw:f.sw,sh:f.sh,reflow:true};chrome();return}
  if(el.classList.contains('cmp')){el.classList.remove('cmp');el._uncmp=1} /* a compacted card shows in full while zoomed */
  const r=el.getBoundingClientRect(),sr=S.el.getBoundingClientRect();
  const w=r.width/k,h=r.height/k;if(w<8||h<8)return;

    if(it.b){const A=it.A,B=it.B,lw=(it.b.w||.13)*sc*(A.f+B.f)/2,dx=B.x-A.x,dy=B.y-A.y,l2=Math.hypot(dx,dy)||1;
      const d3=Math.hypot(A.a.p[0]-B.a.p[0],A.a.p[1]-B.a.p[1],A.a.p[2]-B.a.p[2])*sc*(A.f+B.f)/2||1,sn=Math.min(1,l2/d3)*.9,ux=dx/l2,uy=dy/l2;
      /* the stick starts where it leaves each sphere's surface, so it never runs over a label it should not */
      const ax=A.x+ux*A.r*sn,ay=A.y+uy*A.r*sn,bx=B.x-ux*B.r*sn,by=B.y-uy*B.r*sn,mx=(ax+bx)/2,my=(ay+by)/2;
      ctx.globalAlpha=Math.min(al(A),al(B))*(it.b.alpha==null?1:it.b.alpha);
      [[A,ax,ay],[B,bx,by]].forEach(([E,ex,ey])=>{const c=D.mix(E.a.color,bg,depth(E.z)*fog);
        ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(mx,my);ctx.lineWidth=lw+4;ctx.strokeStyle=D.mix(c,'#000000',.5);ctx.stroke();
        ctx.lineWidth=lw;ctx.strokeStyle=D.mix(c,'#ffffff',.15);ctx.stroke()});
      ctx.globalAlpha=1;return}
    const p=it.p,a=p.a,col=D.mix(a.color,bg,depth(p.z)*fog);
    ctx.globalAlpha=al(p);
    const gr=ctx.createRadialGradient(p.x-p.r*.38,p.y-p.r*.42,p.r*.06,p.x,p.y,p.r);
    gr.addColorStop(0,D.mix(col,'#ffffff',.62));gr.addColorStop(.5,col);gr.addColorStop(1,D.mix(col,'#000000',.36));
    g.circle(p.x,p.y,p.r,gr,D.mix(col,'#000000',.5),v.stroke||3);
    if(a.ring)g.circle(p.x,p.y,p.r+9,null,a.ringColor||D.tok('warm'),7);
    if(a.label&&p.r>10){const lp=Math.max(v.minLabel||36,Math.min(a.labelPx||p.r*.85,72));
      g.chem(a.label,p.x,p.y+lp*.03,lp,{color:D.lum(col)>.3?'#10201c':'#ffffff'})}
    ctx.globalAlpha=1;
  });
  return P;
};

/* ---------- layout: fit the canvas, or fall back to a scrolling page under 760 px ---------- */
function fit(){
  const fl=innerWidth<760;
  if(fl!==flow){flow=fl;document.documentElement.classList.toggle('flow',fl);if(fl){unzoom();stopTimer();flowRender()}else{D.slides.forEach(S=>{S.el.style.zoom='';if(S.i!==D.cur.s){S.el.classList.remove('current');S.sims.forEach(x=>x.active(false))}});const c=D.cur;D.cur={s:-1,f:0};go(c.s,c.f)}}
  if(flow)D.slides.forEach(S=>{S.el.style.zoom=String(innerWidth/W)});
  else{k=Math.min(innerWidth/W,innerHeight/H);$('#stage').style.setProperty('--k',k)}
  Object.values(D.sims).forEach(x=>x.resize());
}
/* a window or full-screen change (or a move to a screen of another density) while a slide shows: the stage scale, every
   animation's size and canvas resolution are refreshed (fit), the cycle's units are measured again and the zoom, if any,
   is laid out afresh on them */
function refit(){
  fit();
  if(!zoom||flow||D.cur.s<0)return;
  const u=zoom.u,m=zoom.manual;clearZoom();
  const U=zoomUnits(),j=U.findIndex(x=>sameUnit(x,u));
  if(j>=0){cyc={U,i:j};zoomTo(U[j],m)}else{cyc=null;zoomTo(u,m)} /* a zoom outside the cycle (a frame's own zoom, the Z key) */
}
function watchDpr(){const q=matchMedia('(resolution: '+(devicePixelRatio||1)+'dppx)');const h=()=>{q.removeEventListener('change',h);refit();watchDpr()};if(q.addEventListener)q.addEventListener('change',h)}
function flowRender(){D.slides.forEach(S=>{const f=S.frames.length-1,st=compute(S,f);S.el.classList.add('current');apply(S,st,S.frames[f],false);fitLayout(S);
  S.sims.forEach(x=>{x.active(true);x.set(st.stg[x.id]!==undefined?st.stg[x.id]:x.stages[0],true)})})}

/* ---------- run-sheet for print ---------- */
function runsheet(){
  const tot={};D.slides.forEach(S=>{tot[S.period]=(tot[S.period]||0)+S.frames.reduce((a,fr)=>a+(fr.t||0),0)});
  let h='<h1>'+esc(document.title)+' · run-sheet</h1>',per=null;
  D.slides.forEach(S=>{let mins=0;S.frames.forEach(fr=>{mins+=fr.t||0});
    if(S.period&&S.period!==per){per=S.period;h+='<h1 class="per">Period '+esc(per)+' · '+mfmt(tot[per])+' min</h1>'}
    h+='<section><h2>'+(S.i+1)+'. '+esc(S.title)+' <small>'+esc([S.sec,S.ref].filter(Boolean).join(' · '))+' · '+mfmt(mins)+' min</small></h2><ol start="0">';
    S.frames.forEach((fr,i)=>{h+='<li><b>'+esc(i?frameLabel(S,fr):(fr.label||'enter'))+'</b>'+(fr.t?' ('+mfmt(fr.t)+' min)':'')+(fr.note?': '+fr.note:'')+'</li>'});
    h+='</ol>'+(S.notes?'<div class="sn">'+S.notes.innerHTML+'</div>':'')+'</section>'});
  $('#runsheet').innerHTML=h;
}

/* ---------- test hooks ---------- */
/* live: the zoomed element's box on screen now (getBoundingClientRect, so any transition, stale scale or offset shows), with the
   unit's rect inside it; for a re-flow, the clone's box. In slide px, with the slide's live size. */
function zoomLive(){const S=D.slides[D.cur.s],sr=S.el.getBoundingClientRect(),q=liveK();
  if(zoom.reflow){const n=zoom.node.getBoundingClientRect();return {x:(n.left-sr.left)/q,y:(n.top-sr.top)/q,w:n.width/q,h:n.height/q,sw:sr.width/q,sh:sr.height/q}}
  const e=zoom.el.getBoundingClientRect(),s=e.width/zoom.ew,b=zoom.b;
  return {x:(e.left-sr.left+b.x*s)/q,y:(e.top-sr.top+b.y*s)/q,w:b.w*s/q,h:b.h*s/q,sw:sr.width/q,sh:sr.height/q}}
D.state=()=>{const S=D.slides[D.cur.s],sims={};S.sims.forEach(x=>{sims[x.id]=x.get()});
  return {s:D.cur.s,f:D.cur.f,ns:D.slides.length,nf:S.frames.length,id:S.id,sims,zoom:zoom?(zoom.el.id||zoom.el.className):null,zoomScale:zoom?zoom.z:0,zoomKind:zoom?zoom.u.kind||'':null,zoomMode:zoom?(zoom.reflow?'reflow':'transform'):null,zoomIndex:zoom&&cyc?cyc.i:-1,zoomCount:zoom&&cyc?cyc.U.length:0,zoomRect:zoom?{x:zoom.rect.x,y:zoom.rect.y,w:zoom.rect.w,h:zoom.rect.h,sw:zoom.sw,sh:zoom.sh}:null,zoomLive:zoom?zoomLive():null,
    blank:blankOn,notes:!$('#notes').hidden,overview:!$('#overview').hidden,timer:timer?{sec:timer.sec,text:$('.d',timer.el).textContent,end:timer.el.classList.contains('end')}:null,
    cue:$('#cue').textContent,theme:document.documentElement.dataset.theme||'light',flow}};

D.start=function(){
  $$('.sim[data-sim]').forEach(h=>{const f=D.types[h.dataset.sim];if(!f){console.error('Deck: unknown animation "'+h.dataset.sim+'"');return}
    const x=f(h,D);x.id=h.id;x.host=h;D.sims[h.id]=x});
  D.slides=$$('#stage>.slide').map(build);
  D.slides.forEach(S=>{if(S.frames.some(fr=>fr.timer)&&!$('.timer',S.el))console.error('Deck: slide '+S.id+' has a timed frame but no .timer slot')});
  D.slides.forEach(S=>S.frames.forEach((fr,i)=>fr.stage.forEach(st=>{const x=D.sims[st.sim];
    if(!x)console.error('Deck: slide '+S.id+' frame '+i+' names unknown animation "'+st.sim+'"');
    else if(!x.stages.includes(st.s))console.error('Deck: slide '+S.id+' frame '+i+': '+st.sim+' has no stage "'+st.s+'"')})));
  runsheet();
  addEventListener('keydown',onKey,true);
  addEventListener('resize',refit);document.addEventListener('fullscreenchange',refit);watchDpr();
  document.addEventListener('click',e=>{const c=e.target.closest&&e.target.closest('button,a,input,select,[tabindex]');if(c)setTimeout(()=>c.blur(),0);
    if(blankOn)blank(false);const ob=e.target.closest&&e.target.closest('#overview button');if(ob){overview(false);go(+ob.dataset.i,0);return}
    const op=e.target.closest&&e.target.closest('.slide .opt');if(op&&!flow)grade(op);
    if(e.target.closest&&e.target.closest('#count,#sec')&&!flow)overview(true)},true);
  document.addEventListener('change',e=>{if(e.target.tagName==='SELECT')e.target.blur()},true);
  const m=/^#(\d+)(?:\.(\d+))?$/.exec(location.hash);
  k=Math.min(innerWidth/W,innerHeight/H);$('#stage').style.setProperty('--k',k);
  go(m?m[1]-1:0,m&&m[2]?+m[2]:0);
  fit();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(!flow&&D.cur.s>=0&&!zoom)fitLayout(D.slides[D.cur.s]);Object.values(D.sims).forEach(x=>x.resize())});
  if(RM.addEventListener)RM.addEventListener('change',()=>{if(!flow){const c=D.cur;D.cur={s:c.s,f:-9};go(c.s,c.f)}});
};
})();
