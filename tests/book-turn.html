<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book turn browser checks</title>
<style>
body{margin:16px;font:15px/1.5 system-ui;background:#eef2ef;color:#1b302e}
h1{font-size:22px;margin:0 0 8px}button{font:inherit;padding:6px 12px;margin:0 8px 8px 0}
#status{font-weight:700}details{max-width:1280px;margin:8px 0}iframe{display:block;border:0;height:840px;background:#fff;max-width:none}
.pass{color:#17663d}.fail{color:#a42821}
</style>
<h1>Book turn browser checks</h1>
<p>Serve the repository over HTTP and open this page. These checks exercise real chapter controllers at desktop, tablet, and phone widths.</p>
<button id="run">Run checks</button><button id="preview">Show a turn halfway</button><button id="resume">Finish turn</button>
<span id="status" role="status">Ready</span>
<details><summary>Results</summary><ol id="results"></ol></details>
<iframe id="reader" title="Reading chapter under test" style="width:1280px"></iframe>
<script>
(function(){
  'use strict';
  const frame=document.querySelector('#reader'),results=document.querySelector('#results'),status=document.querySelector('#status');
  const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  const check=(ok,message)=>{if(!ok)throw Error(message);const li=document.createElement('li');li.className='pass';li.textContent=message;results.append(li)};
  const doc=()=>frame.contentDocument,win=()=>frame.contentWindow;
  const page=()=>doc().querySelector('#pinfo').textContent;
  const firstPage=()=>Number(page().match(/\d+/)[0]);
  const layer=()=>doc().querySelector('.book-turn-layer');
  const click=selector=>doc().querySelector(selector).click();
  async function until(test){const end=Date.now()+12000;while(!test()){if(Date.now()>end)throw Error('Timed out waiting for reader');await sleep(25)}}
  const settled=()=>until(()=>!layer()&&!doc().querySelector('.measuring'));
  function key(value,target=doc().body){target.dispatchEvent(new (win().KeyboardEvent)('keydown',{key:value,bubbles:true}))}
  function swipe(dx,dy){
    const target=doc().querySelector('#book .page.on .pbody');
    for(const [type,touches,changed] of [['touchstart',[{clientX:240,clientY:240}],[]],['touchend',[],[{clientX:240+dx,clientY:240+dy}]]]){
      const event=new (win().Event)(type,{bubbles:true});Object.defineProperties(event,{touches:{value:touches},changedTouches:{value:changed}});target.dispatchEvent(event);
    }
  }
  async function load(path='unit2/reading-2-1.html',width=1280,reduced=false){
    frame.style.width=width+'px';
    const url=new URL('../'+path,location.href).href;
    const loaded=new Promise(resolve=>frame.onload=resolve);
    // srcdoc gives the test isolated preferences and lets reduced motion be tested
    // before the reader's controller initializes, without changing browser settings.
    const response=await fetch(url);if(!response.ok)throw Error('Cannot load '+path);
    let html=await response.text();
    const setup='<base href="'+url+'"><script>const originalMedia=window.matchMedia.bind(window);window.matchMedia=q=>'+(reduced?'q.includes("prefers-reduced-motion")?{matches:true,addEventListener(){},removeEventListener(){}}:':'')+'originalMedia(q);<\/script>';
    html=html.replace('<head>','<head>'+setup);
    frame.srcdoc=html;await loaded;await until(()=>doc().querySelector('#pinfo')?.textContent);
    await doc().fonts.ready;await sleep(150);
    if(doc().querySelector('#book').classList.contains('scroll'))click('#mode [data-m="book"]');
    // Return to the opener using the public controls, including when saved progress exists.
    for(let n=0;n<150&&!doc().querySelector('#prev').disabled;n++)click('#prev');
    await settled();
  }
  async function run(){
    results.replaceChildren();status.textContent='Running…';document.querySelector('#run').disabled=true;
    try{
      await load();check(firstPage()===1,'Desktop reader starts on the first spread');
      click('#next');check(firstPage()===3&&!!layer(),'Forward navigation starts an animated two-page turn');
      check(layer().inert&&layer().getAttribute('aria-hidden')==='true','Animation snapshots stay outside keyboard and screen-reader navigation');
      const ids=[...doc().querySelectorAll('[id]')].map(el=>el.id);check(new Set(ids).size===ids.length,'Snapshot IDs do not duplicate live activity or SVG IDs');
      const leaf=doc().querySelector('.book-turn-leaf');
      await until(()=>leaf.isConnected&&win().getComputedStyle(leaf).transform.startsWith('matrix3d'));
      check(true,'The sheet rotates in 3D during the turn');
      await settled();check(!doc().querySelector('#book').classList.contains('is-turning'),'Completed turns remove the overlay and restore interaction');
      const canvas=doc().querySelector('#book .page.on canvas');
      const probe=[...doc().querySelectorAll('#book .page.on button')].find(b=>b.textContent==='Probe from the left');probe.click();
      const state=canvas.closest('[data-sim]').textContent;
      click('#next');click('#prev');await settled();
      check(canvas===doc().querySelector('#book .page.on canvas')&&canvas.closest('[data-sim]').textContent===state,'Simulation nodes and progress survive forward and reverse turns');
      key('ArrowLeft');check(firstPage()===1&&layer().classList.contains('backward'),'Keyboard navigation turns the sheet in the reverse direction');await settled();
      swipe(-120,180);check(firstPage()===1,'A diagonal vertical gesture does not turn a page');
      swipe(-120,5);check(firstPage()===3&&!!layer(),'A horizontal gesture turns the page');await settled();
      const before=firstPage();key('ArrowRight',canvas);check(firstPage()===before,'Arrow keys inside a simulation do not navigate the reader');
      for(let n=0;n<4;n++){click('#next');check(doc().querySelectorAll('.book-turn-layer').length<=1,'Rapid navigation keeps at most one animation overlay')}
      await settled();click('#prev');click('#mode [data-m="scroll"]');check(!layer()&&doc().querySelector('#book').classList.contains('scroll'),'Switching to Scroll during a turn cancels the animation');
      click('#mode [data-m="book"]');click('#next');
      win().dispatchEvent(new (win().Event)('beforeprint'));check(!layer(),'Print preparation cancels the animation');win().dispatchEvent(new (win().Event)('afterprint'));await settled();
      click('#toc-b');doc().querySelector('#toc button:last-child').click();check(!!layer(),'Contents jumps use the same page-turn effect');await settled();
      for(let n=0;n<150&&!doc().querySelector('#next').disabled;n++)click('#next');await settled();
      check(doc().querySelector('#next').disabled,'The final page stops forward navigation');
      click('#prev');frame.style.width='900px';await until(()=>doc().querySelector('#book').classList.contains('single'));await sleep(100);
      check(!layer(),'Resizing during a turn clears the animation before repagination');
      const tabletPage=firstPage();click('#next');check(firstPage()===tabletPage+1&&layer().classList.contains('single'),'Tablet navigation turns one page at a time');await settled();
      await load('unit2/reading-2-1.html',390);click('#next');check(firstPage()===2&&layer().classList.contains('single'),'Phone layout uses a single-sheet turn');await settled();
      check(doc().documentElement.scrollWidth<=win().innerWidth+1,'Phone page turns do not introduce horizontal scrolling');
      await load('unit2/reading-2-1.html',1280,true);click('#next');check(firstPage()===3&&!layer(),'Reduced motion navigates immediately without an animated overlay');
      for(const unit of [1,3,4,5,6,7]){
        status.textContent='Checking Unit '+unit+'…';await load('unit'+unit+'/reading-'+unit+'-1.html');
        click('#next');check(firstPage()===3&&!!layer(),'Unit '+unit+' uses the shared page turn');await settled();
      }
      status.textContent=results.children.length+' checks passed';status.className='pass';
    }catch(error){status.textContent='Failed: '+error.message;status.className='fail';const li=document.createElement('li');li.className='fail';li.textContent=error.stack;results.append(li);console.error(error)}
    finally{document.querySelector('#run').disabled=false}
  }
  document.querySelector('#run').onclick=run;
  document.querySelector('#preview').onclick=async()=>{
    await load();click('#next');await sleep(260);
    if(layer())layer().getAnimations({subtree:true}).forEach(animation=>animation.pause());
    status.textContent='Turn paused for visual inspection';
  };
  document.querySelector('#resume').onclick=()=>{if(layer())layer().getAnimations({subtree:true}).forEach(animation=>animation.play())};
})();
</script>
</html>
